<template id="notes-t"><div class="notes">
    <h2>About the data</h2>
    <p>Everything here comes from the <code>.mdsr</code> server recordings in <code>E:\mordnn-data\server-recordings</code>: 144 files, about 20.2 hours across Nov 15–21, 2026. The 122 files from the recorder mod (<code>-http</code>) carry full fighter rows; the others are older formats. <b>Humans</b> are people, <b>cbot</b> is our bot, and Mordhau's built-in bots are left out of the human-vs-cbot comparisons.</p>
    <h3>Read these numbers with care</h3>
    <ul>
      <li><b>cbot samples are small.</b> The recorder-mod files give 2,619 full-rate cbot attack starts (against 46,108 human), 2,505 cbot swings with a usable tip path (44,819 human), and 368 cbot landed hits on the aim page. Rows with under 30 cbot cases are marked on the pages and mean little.</li>
      <li><b>Attack stages were inferred:</b> 0 windup, 1 release, 2 recovery. The schema names only release.</li>
      <li><b>Movement input is plotted as recorded</b> (<code>move_forward</code>, <code>move_right</code>); the footwork grid shows -0.4 to 0.9 and says how many rows fall outside it.</li>
      <li><b>Feints and parried attacks can be counted</b> from the fighter row's <code>motion_class</code> (<code>BP_FeintedMotion_Comp_C</code> for a cancelled windup, <code>BP_BlockedMotion_Comp_C</code> for a parried attack). The recorder-mod files carry no <code>net_motion_type</code>, so there is no per-motion type field; the transitions page counts feints per attack start from <code>motion_class</code>.</li>
      <li><b>Crowd sizes are what was recorded:</b> at most 21 fighters and 14 cbots alive in any one tick, so the server page cannot say anything about bigger crowds.</li>
      <li><b>Kills are rebuilt,</b> not logged: the victim is the fighter whose rows stop at a death, the killer is the last hitter within about 5 s, and a kill counts only when the scoreboard confirms it.</li>
      <li><b>Timing charts use full-rate rows only.</b> Fighters far from a fight are recorded at about 10 Hz.</li>
      <li><b>Skirmish and team maps</b> compare against the other team; free-for-all maps against every other fighter.</li>
    </ul>
    <h3>Recorder bugs found</h3>
    <ul>
      <li><code>death.victim</code> is a synthetic id (60000+), not a player.</li>
      <li><code>hit.health_after</code> holds the victim's health before the hit.</li>
      <li><code>hit.weapon</code> is always <code>BP_MorhauCharacter_C</code>; the held weapon is in the fighter row.</li>
    </ul>

function drawHeat(cv,H){
  const r=cv.getBoundingClientRect(), dpr=devicePixelRatio||1, W=Math.max(1,r.width), Hh=Math.max(1,r.height);
  cv.width=Math.round(W*dpr); cv.height=Math.round(Hh*dpr); const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle=cssv("--muted"); c.fillRect(0,0,W,Hh);
  if(!H) return;
  const cs=Math.min(W/H.w,Hh/H.h)*0.92, ox=(W-cs*H.w)/2, oy=(Hh-cs*H.h)/2, ac=cssv("--accent");
  c.fillStyle=ac;
  for(let j=0;j<H.h;j++) for(let i=0;i<H.w;i++){ const ch=H.g[j*H.w+i]; if(ch==="."||ch==null) continue; const v=(+ch+1)/10;
    c.globalAlpha=0.12+0.88*v*v; const pad=cs*0.08; c.beginPath(); c.roundRect?c.roundRect(ox+i*cs+pad,oy+j*cs+pad,cs-2*pad,cs-2*pad,cs*0.25):c.rect(ox+i*cs+pad,oy+j*cs+pad,cs-2*pad,cs-2*pad); c.fill(); }
  c.globalAlpha=1;
}
let heatIO=null;
function heatAll(scope){
  if(!heatIO) heatIO=new IntersectionObserver(es=>{ for(const e of es) if(e.isIntersecting){ heatIO.unobserve(e.target); drawHeat(e.target,e.target._h); } },{rootMargin:"200px"});
  scope.querySelectorAll("canvas.heat").forEach(cv=>{ heatIO.observe(cv); });
}
themeHooks.push(()=>document.querySelectorAll("canvas.heat").forEach(cv=>{ if(cv.width>1) drawHeat(cv,cv._h); }));

// ===== router
let page=null;      // the current page's teardown
function route(){
  const h=location.hash.replace(/^#/,"")||"/", [path,qs]=h.split("?"), q=new URLSearchParams(qs||""), seg=path.split("/").filter(Boolean);
  const r=seg[0]||"home";
  if(r==="s"&&seg[1]&&page&&page.sid===seg[1]){ page.query(q); return; }      // the same session: only seek
  if(page&&page.off) page.off(); page=null; endFs();
  document.querySelectorAll("#nav a[data-r]").forEach(a=>a.setAttribute("aria-current",String(a.dataset.r===(r==="s"?"home":r==="p"?"players":r))==="true"?"page":"false"));
  scrollTo(0,0);
  if(r==="s"&&seg[1]) return sessionPage(seg[1],q);
  if(r==="players") return playersPage();
  if(r==="p"&&seg[1]) return playerPage(seg[1]);
  if(r==="stats") return statsPage(seg[1]);
  if(r==="about") return aboutPage();
  return homePage(q);
}
addEventListener("hashchange",route);
function fail(e){ app.innerHTML='<div class="empty">Could not load this page ('+esc(e&&e.message||e)+').</div>'; }

      '<div class="ct"><span class="t">'+esc(m.title)+'</span></div><div class="cm num">'+esc(prettyMap(r.map))+' · '+esc(when(r.date))+' · '+esc(dur(m.t1-m.t0))+'</div></div></a>').join("")+'</div></section>'+
    '<section class="sec"><h2>All sessions</h2><div class="filters">'+
      '<input type="search" id="fq" placeholder="Find a player…" aria-label="Find a player" value="'+esc(HS.q)+'">'+
      '<select id="fmap" aria-label="Map"><option value="">All maps</option>'+maps.map(m=>'<option value="'+esc(m)+'"'+(m===HS.map?" selected":"")+'>'+esc(mapLabel(m))+'</option>').join("")+'</select>'+

    const S={new:(a,b)=>a.date<b.date?1:-1,kills:(a,b)=>b.kills-a.kills,long:(a,b)=>b.dur-a.dur,players:(a,b)=>b.players.length-a.players.length}[HS.sort];

// ===== a session: moments, the whole-session timeline, the viewer
const tip=$("tip");
function showTip(html,ev){ tip.innerHTML=html; tip.style.opacity=1; const w=tip.offsetWidth; let x=ev.clientX+12; if(x+w>innerWidth-6) x=ev.clientX-w-12; tip.style.left=Math.max(6,x)+"px"; tip.style.top=(ev.clientY+16)+"px"; }
const hideTip=()=>{ tip.style.opacity=0; };
function toast(t){ const e=$("toast"); e.textContent=t; e.style.opacity=1; clearTimeout(e._t); e._t=setTimeout(()=>e.style.opacity=0,1800); }

// part downloads the session page starts for its viewer frames (watch.html takes them from parent.__mdPre: url -> Promise of the bytes), so a part
// downloads while the viewer's own page loads instead of after it; the last 4 are kept
const PRE=window.__mdPre=new Map();
function prefetch(u){
  if(PRE.has(u)){ const v=PRE.get(u); PRE.delete(u); PRE.set(u,v); return; }
  const P=fetch(u).then(r=>{ if(!r.ok) throw new Error(r.status+" "+u); return r.arrayBuffer(); });
  P.catch(()=>{ if(PRE.get(u)===P) PRE.delete(u); });
  PRE.set(u,P); while(PRE.size>4) PRE.delete(PRE.keys().next().value);
}

async function sessionPage(sid,q){
  app.innerHTML='<p class="loading">Loading the session…</p>';
  let S; try{ S=await getJSON("data/"+sid+"/session.json"); }catch(e){ return fail(e); }
  document.title=prettyMap(S.map)+", "+when(S.date)+" · cbot Fight Recordings";
  const byPid={}; S.players.forEach(p=>byPid[p.pid]=p);
  const humans=S.players.filter(p=>p.b!=="bot");
  const nk=S.kills.filter(k=>k.a!=null&&k.a!==k.v).length;
  const moms=S.moments.slice().sort((a,b)=>a.t0-b.t0);
  app.innerHTML='<a class="crumb" href="#/">← All replays</a>'+
    '<div class="shead"><div class="grow"><h1>'+esc(prettyMap(S.map))+' '+modeBadge(S.mode)+'</h1><p class="lede num">'+esc(when(S.date,true))+' · '+esc(dur(S.dur))+' · '+plural(humans.length,"player")+' · '+plural(nk,"kill")+(S.rounds.length?' · '+plural(S.rounds.length,"round"):'')+'</p></div>'+
    '<button class="btn" id="share">'+IC.share+'Copy link to this moment</button></div>'+
    (moms.length?'<div class="moms" id="moms" aria-label="Moments">'+moms.map((m,i)=>'<button class="mom" data-i="'+i+'"><b>'+esc(m.title)+'</b><span class="num"><i style="background:'+kc(m.k)+'"></i>'+esc(KNAME[m.k]||m.k)+' · '+clock(m.t0)+' · '+esc(dur(m.t1-m.t0))+'</span></button>').join("")+'</div>':'')+
    '<div class="tlw"><canvas id="stl" aria-label="The whole session: one lane per fighter, kills, moments. Click to jump there."></canvas><div class="tlk" id="tlk"></div></div><div class="score" id="score" aria-live="off"></div>'+
    '<div class="vstage" id="vstage"><div class="vload" id="vload">Loading…</div></div>';
  $("tlk").innerHTML=Object.keys(KNAME).filter(k=>moms.some(m=>m.k===k)).map(k=>'<span><i style="background:'+kc(k)+'"></i>'+KNAME[k]+'</span>').join("")+
    '<span><i style="background:'+cssv("--destructive")+';border-radius:50%"></i>Kill</span><span class="muted">Click a name to follow that fighter</span>';
  // ---- player state
  const V={sid,S,i:-1,t:0,pid:null,cam:"top",speed:1,playing:true,frames:[],act:null,urlAt:0};
  const stage=$("vstage"), vload=$("vload");
  for(let k=0;k<2;k++){ const f=document.createElement("iframe"); f.className="off"; f.setAttribute("allow","fullscreen; autoplay"); f.title="Replay viewer"; f.setAttribute("scrolling","no"); stage.appendChild(f); V.frames.push(f); }
  const partAt=t=>{ let i=S.parts.findIndex(p=>t>=p.t0&&t<p.t1); if(i<0) i=S.parts.findIndex(p=>p.t0>=t); if(i<0) i=S.parts.length-1; return i; };
  // a part's file: the binary one (pages_site/binpack.py) where the build made them; the download starts here, beside the viewer's own page
  const segUrl=i=>"data/"+sid+"/"+(SITE&&SITE.bin?S.parts[i].f.replace(/\.json$/,".bin"):S.parts[i].f);
  function hashOf(i,tl,o){      // the viewer's address for part i at tl
    const pt=S.parts[i], fi=o.pid!=null?pt.pids.indexOf(o.pid):-1;
    prefetch(segUrl(i));
    let h=themeKey+"&seg="+encodeURIComponent(segUrl(i))+"&start="+Math.max(0,tl).toFixed(2);
    if(fi>=0){ h+="&follow="+fi; if(o.cam&&o.cam!=="top") h+="&cam="+o.cam; }
    if(o.speed&&o.speed!==1) h+="&speed="+o.speed;
    if(!o.play) h+="&paused=1";
    return h;
  }
  const src=(i,tl,o)=>"watch.html#"+hashOf(i,tl,o);
  const other=f=>V.frames[0]===f?V.frames[1]:V.frames[0];
  // The hidden frame waits as a standby viewer (watch.html with no part: its page and script loaded, ahead of time), so opening a part there
  // skips loading the page: about half of a jump's time (measured). f._sb: it is waiting; f._part -1: no part asked of it.
  function openIn(f,i,tl){ const o={pid:V.pid,cam:V.cam,speed:V.speed,play:false}; f._o=o;
    if(f._sb){ f._sb=false; post(f,{mdCmd:"open",h:hashOf(i,tl,o)}); } else f.src=src(i,tl,o); }
  function standby(f){ f._part=-1; f._ready=false; f._sb=false; f._want=null; f.src="watch.html#"+themeKey+"&standby=1"; }
  function standbyLater(f){ clearTimeout(V.sbT); V.sbT=setTimeout(()=>{ if(f!==V.act&&!(f._part>=0)&&!f._sb&&V.frames.includes(f)) standby(f); },1200); }      // after the jump's own start-up
  function load(i,tl,play){      // open part i at tl (s into the part) in the hidden frame; it shows when it is ready
    const f=V.act?other(V.act):V.frames[0];
    f._part=i; f._ready=false; f._want={jump:true,play}; openIn(f,i,tl);
    vload.hidden=false; vload.textContent="Loading "+clock(S.parts[i].t0+tl)+"…";
  }
  function preload(i){ const f=other(V.act); if(f._part===i||(f._want&&f._want.jump&&!f._ready&&f._part>=0)) return; f._part=i; f._ready=false; f._want={jump:false}; openIn(f,i,0); }
  function post(f,m){ try{ f.contentWindow.postMessage(m,"*"); }catch(e){} }
  function swap(f,play){
    const old=V.act; V.act=f; V.i=f._part; f.classList.remove("off"); if(old&&old!==f){ old.classList.add("off"); old._part=-1; old._ready=false; old._sb=false; old.src="about:blank"; }
    { const g=other(f); if(g._part==null||g._part<0) standbyLater(g); }
    const pt=S.parts[V.i], fi=V.pid!=null?pt.pids.indexOf(V.pid):-1, o=f._o||{};
    if(o.pid!==V.pid||o.cam!==V.cam) post(f,{mdCmd:"follow",p:fi,cam:fi>=0?V.cam:"top"});
    if(o.speed!==V.speed) post(f,{mdCmd:"speed",v:V.speed});
    if(play) post(f,{mdCmd:"play"});
    vload.hidden=true; drawTL();
  }
  function seekTo(t,play){
    t=Math.max(0,Math.min(S.dur-0.05,t)); const i=partAt(t), pt=S.parts[i], tl=Math.max(0,t-pt.t0);
    V.t=pt.t0+tl; if(play!=null) V.playing=play;
    if(V.act&&V.i===i&&V.act._ready){ post(V.act,{mdCmd:"seek",t:tl,play:V.playing}); drawTL(); return; }
    load(i,tl,V.playing); drawTL();
  }
  function onMsg(ev){
    const d=ev.data; if(!d) return; const f=V.frames.find(x=>x.contentWindow===ev.source); if(!f) return;
    if(typeof d.mdFullscreen==="boolean"){ d.mdFullscreen?startFs(f):endFs(f); return; }
    if(d.mdHost==="height"&&d.h>0){ if(f!==fsFrame){ f.style.height=Math.min(Math.max(d.h,300),6000)+"px"; } return; }
    if(typeof d.mdFrameHeight==="number") return;      // the theme bootstrap's report: the viewer sends its own (mdHost "height")
    if(d.mdHost==="standby"){ if(f._part===-1) f._sb=true; return; }      // (one sent just before the frame was given a part is late: ignored)
    if(d.mdHost==="ready"){ f._ready=true; if(f._want&&f._want.jump) swap(f,f._want.play); return; }
    if(d.mdHost==="error"){ if(f._want&&f._want.jump){ vload.hidden=false; vload.textContent="This part could not be loaded."; } return; }
    if(f!==V.act) return;
    if(d.mdHost==="state"){
      const pt=S.parts[V.i]; V.t=pt.t0+d.t; V.playing=d.playing; V.speed=d.speed;
      // the followed fighter sticks while they are away (left, or not yet joined): only a choice in the viewer changes it
      if(d.follow>=0){ V.pid=pt.pids[d.follow]; V.cam=d.cam; } else if(V.pid==null||pt.pids.includes(V.pid)){ V.pid=null; V.cam="top"; }
      if(V.i+1<S.parts.length&&pt.t1-V.t<25) preload(V.i+1);
      drawTL(); markMom();
      const now=performance.now(); if(now-V.urlAt>1500){ V.urlAt=now; history.replaceState(null,"",shareUrl()); }
    } else if(d.mdHost==="end"){
      const n=V.i+1; if(n>=S.parts.length) return;
      const g=other(f); if(g._part===n&&g._ready) swap(g,true); else if(g._part===n){ g._want={jump:true,play:true}; vload.hidden=false; vload.textContent="Loading…"; } else load(n,0,true);
    }
  }
  addEventListener("message",onMsg);
  function shareUrl(){ let u="#/s/"+sid+"?t="+Math.floor(V.t); if(V.pid!=null){ u+="&f="+V.pid; if(V.cam!=="top") u+="&cam="+V.cam; } return u; }
  $("share").onclick=async()=>{ const u=location.href.split("#")[0]+shareUrl(); try{ await navigator.clipboard.writeText(u); toast("Link copied"); }catch(e){ prompt("Copy this link",u); } };
  // ---- moments
  function markMom(){ const el=$("moms"); if(!el) return; el.querySelectorAll(".mom").forEach(b=>{ const m=moms[+b.dataset.i]; b.classList.toggle("cur",V.t>=m.t0&&V.t<m.t1); }); }
  if($("moms")) $("moms").onclick=e=>{ const b=e.target.closest(".mom"); if(!b) return; const m=moms[+b.dataset.i];
    if(m.pids&&m.pids.length&&byPid[m.pids[0]]) V.pid=m.pids[0]; seekTo(m.t0,true); };
  // ---- the timeline
  const cv=$("stl"), ctx=cv.getContext("2d"); let TW=0,TH=0,LX=0,LANE=0,TOP=0;
  const lanes=S.players.filter(p=>p.b!=="bot"||S.players.length<=12);
  function layout(){ const r=cv.getBoundingClientRect(), dpr=devicePixelRatio||1; TW=r.width; LANE=lanes.length>14?7:lanes.length>8?10:13; TOP=16; TH=TOP+lanes.length*LANE+16;
    cv.style.height=TH+"px"; cv.width=Math.round(TW*dpr); cv.height=Math.round(TH*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); LX=Math.min(130,Math.max(70,TW*0.12)); }
  const X=t=>LX+(TW-LX-6)*Math.min(1,Math.max(0,t/S.dur)), T=x=>Math.min(S.dur,Math.max(0,(x-LX)/(TW-LX-6)*S.dur));
  let TLC=null; const tc=n=>{ if(!TLC) TLC={}; return n in TLC?TLC[n]:(TLC[n]=cssv(n)); };      // the timeline's colours, read once per theme (getComputedStyle on every draw was the cost)
  function drawTL(){
    if(!TW) layout(); const c=ctx, fg=tc("--foreground"), mu=tc("--muted-foreground"), bd=tc("--border");
    c.clearRect(0,0,TW,TH); c.font="11px "+tc("--font-sans"); c.textBaseline="middle";
    // rounds
    S.rounds.forEach((r,i)=>{ c.fillStyle=tc("--muted"); if(i%2===0){ c.fillRect(X(r.t0),TOP-2,X(r.t1)-X(r.t0),lanes.length*LANE+4); } });
    // moments band
    for(const m of moms){ c.fillStyle=tc(KCOL[m.k]||"--muted-foreground"); c.globalAlpha=0.85; const x0=X(m.t0), x1=Math.max(x0+3,X(m.t1)); c.beginPath(); c.roundRect?c.roundRect(x0,2,x1-x0,8,3):c.rect(x0,2,x1-x0,8); c.fill(); }
    c.globalAlpha=1;
    // lanes
    lanes.forEach((p,j)=>{ const y=TOP+j*LANE, col=tc("--"+p.col)||fg, sel=V.pid===p.pid;
      c.fillStyle=sel?fg:mu; c.font=(sel?"600 ":"")+"11px "+tc("--font-sans"); let nm=p.n; while(c.measureText(nm).width>LX-12&&nm.length>3) nm=nm.slice(0,-2)+"…"; c.fillText(nm,0,y+LANE/2);
      c.fillStyle=col; c.globalAlpha=sel?1:0.75; for(const [a,b] of p.lane){ const x0=X(a), w=Math.max(1,X(b)-x0); c.fillRect(x0,y+LANE*0.2,w,LANE*0.6); } c.globalAlpha=1; });
    // kills: a dot on the victim's lane
    const li={}; lanes.forEach((p,j)=>li[p.pid]=j); c.fillStyle=tc("--destructive");
    for(const k of S.kills){ const j=li[k.v]; if(j==null) continue; c.beginPath(); c.arc(X(k.t),TOP+j*LANE+LANE/2,Math.max(2,LANE*0.28),0,7); c.fill(); }

    c.strokeStyle=bd; c.lineWidth=1; c.beginPath(); c.moveTo(LX,TH-6.5); c.lineTo(TW-6,TH-6.5); c.stroke();
    if(V.i>=0){ const pt=S.parts[V.i]; c.strokeStyle=tc("--accent"); c.globalAlpha=0.35; c.lineWidth=3; c.beginPath(); c.moveTo(X(pt.t0),TH-6.5); c.lineTo(X(pt.t1),TH-6.5); c.stroke(); c.globalAlpha=1; }
    const x=X(V.t); c.strokeStyle=tc("--accent"); c.lineWidth=2; c.beginPath(); c.moveTo(x,0); c.lineTo(x,TH-2); c.stroke();
    c.fillStyle=tc("--accent"); c.beginPath(); c.arc(x,TH-6.5,4,0,7); c.fill();
    c.fillStyle=mu; c.font="10.5px "+tc("--font-sans"); c.textAlign="right"; c.fillText(clock(V.t)+" / "+clock(S.dur),LX-8,TH-6.5); c.textAlign="left";
    score();
  }
  // the scoreboard so far: kills and deaths up to the playhead, the humans and cbot (most kills first)
  let scKey="";
  function score(){
    const K={},D={}; for(const k of S.kills){ if(k.t>V.t) continue; if(k.v!=null) D[k.v]=(D[k.v]||0)+1; if(k.a!=null&&k.a!==k.v) K[k.a]=(K[k.a]||0)+1; }
    const L=S.players.filter(p=>p.b!=="bot").map(p=>({p,k:K[p.pid]||0,d:D[p.pid]||0})).sort((a,b)=>b.k-a.k||a.d-b.d);
    const key=L.map(x=>x.p.pid+":"+x.k+":"+x.d).join(",")+"|"+V.pid; if(key===scKey) return; scKey=key;
    $("score").innerHTML='<span class="sl">Score so far (kills – deaths)</span>'+L.map(x=>'<span class="sp"'+(x.p.pid===V.pid?' style="border-color:var(--accent)"':'')+'><i style="background:var(--'+esc(x.p.col)+')"></i>'+esc(x.p.n||"?")+' <b>'+x.k+' – '+x.d+'</b></span>').join("");
  }
  function hitTest(ev){ const r=cv.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top; return {x,y,t:T(x),lane:Math.floor((y-TOP)/LANE)}; }
  let drag=false;
  cv.addEventListener("pointerdown",ev=>{ const h=hitTest(ev); if(h.x<LX){ const p=lanes[h.lane]; if(p&&h.y>=TOP){ V.pid=V.pid===p.pid?null:p.pid; if(V.act){ const pt=S.parts[V.i], fi=V.pid!=null?pt.pids.indexOf(V.pid):-1; post(V.act,{mdCmd:"follow",p:fi,cam:V.cam}); } drawTL(); } return; }
    drag=true; cv.setPointerCapture(ev.pointerId); V.t=h.t; drawTL(); });
  cv.addEventListener("pointermove",ev=>{ const h=hitTest(ev);
    if(drag){ V.t=h.t; drawTL(); return; }
    if(h.x<LX){ const p=lanes[h.lane]; if(p&&h.y>=TOP){ const st=p.st||{}; showTip('<b>'+esc(p.n)+'</b> ('+esc(p.b)+')<br>'+(st.kills||0)+' kills · '+(st.deaths||0)+' deaths · '+(st.hits||0)+' hits<br><span class=muted>Click to follow</span>',ev); cv.style.cursor="pointer"; } else hideTip(); return; }
    cv.style.cursor="pointer";
    let html='<b class=num>'+clock(h.t)+'</b>';
    const near=S.kills.filter(k=>Math.abs(X(k.t)-h.x)<5); for(const k of near.slice(0,3)) html+='<br>'+(k.a!=null&&byPid[k.a]&&k.a!==k.v?esc(byPid[k.a].n)+' kills ':'')+esc((byPid[k.v]||{}).n||"?")+(k.a==null||k.a===k.v?' dies':'');
    if(h.y<TOP){ const m=moms.find(m=>h.x>=X(m.t0)-2&&h.x<=Math.max(X(m.t0)+3,X(m.t1))+2); if(m) html+='<br>'+esc(m.title); }
    showTip(html,ev); });
  cv.addEventListener("pointerup",ev=>{ if(!drag) return; drag=false; const h=hitTest(ev); if(h.y<TOP){ const m=moms.find(m=>h.x>=X(m.t0)-2&&h.x<=Math.max(X(m.t0)+3,X(m.t1))+2); if(m){ if(m.pids&&m.pids.length) V.pid=m.pids[0]; seekTo(m.t0,true); return; } } seekTo(h.t,null); });
  cv.addEventListener("pointerleave",hideTip);
  const ro=new ResizeObserver(()=>{ layout(); drawTL(); }); ro.observe(cv);
  // a theme change: the playing viewer recolours itself (no reload); a frame still loading is loaded again with the new theme in its address
  const reTheme=()=>{ TLC=null; drawTL();
    for(const f of V.frames){ if(f._part==null||f._part<0) continue;
      if(f._ready) post(f,{mdTheme:themeKey});
      else { const tl=f===V.act?V.t-S.parts[f._part].t0:0; f._ready=false; f.src=src(f._part,Math.max(0,tl),{pid:V.pid,cam:V.cam,speed:V.speed,play:false}); } } };
  themeHooks.push(reTheme);
  // ---- start
  function fromQuery(q){ const t=parseFloat(q.get("t")), f=parseInt(q.get("f"),10), cam=q.get("cam");
    if(isFinite(f)&&byPid[f]) V.pid=f; if(["fp","tp","fc"].includes(cam)) V.cam=cam; return isFinite(t)?t:(S.parts[0]?S.parts[0].t0:0); }
  layout(); seekTo(fromQuery(q),true);
  window.__site={V,seekTo,parts:S.parts};      // test hook
  page={sid,query(q){ seekTo(fromQuery(q),true); },off(){ removeEventListener("message",onMsg); ro.disconnect(); const k=themeHooks.indexOf(reTheme); if(k>=0) themeHooks.splice(k,1); clearTimeout(V.sbT); V.frames.forEach(f=>f.src="about:blank"); PRE.clear(); hideTip(); }};
}

// pseudo-fullscreen for the viewer frame (the page asks {mdFullscreen:true} when the browser's own cannot be used)
let fsFrame=null,fsY=0,fsH="";
function startFs(f){ if(fsFrame===f) return; endFs(); fsFrame=f; fsY=scrollY; fsH=f.style.height; f.classList.add("fsframe"); root.classList.add("fslock"); }
function endFs(f){ if(!fsFrame||(f&&f!==fsFrame)) return; const g=fsFrame; fsFrame=null; g.classList.remove("fsframe"); root.classList.remove("fslock"); g.style.height=fsH; scrollTo(0,fsY); }
addEventListener("keydown",ev=>{ if(ev.key!=="Escape"||!fsFrame) return; const g=fsFrame; endFs(); try{ g.contentWindow.postMessage({mdFsExit:true},"*"); }catch(e){} });

// ===== players
const PS={q:"",sort:"alive_s",dir:-1};
const kd=(k,d)=>d?(k/d).toFixed(2):k?"∞":"–";
async function playersPage(){
  document.title="Players · cbot Fight Recordings";
  let L; try{ L=await PLAY(); }catch(e){ return fail(e); }
  const cols=[["n","Player"],["sessions","Sessions"],["alive_s","Time fighting"],["kills","Kills"],["deaths","Deaths"],["kd","K/D"],["kdh","K/D vs humans"],["hits","Hits"],["parries","Parries"]];
  const val=(p,k)=>k==="n"?p.n.toLowerCase():k==="sessions"?p.sessions.length:k==="kd"?(p.st.deaths?(p.st.kills||0)/p.st.deaths:(p.st.kills||0)):k==="kdh"?(p.st.deaths_h?(p.st.kills_h||0)/p.st.deaths_h:(p.st.kills_h||0)):(p.st[k]||0);
  app.innerHTML='<h1>Players</h1><p class="lede">'+plural(L.filter(p=>p.b==="human").length,"human")+' and cbot, over every recorded session. Kills and deaths are rebuilt from the recordings; K/D vs humans counts only fights between two people.</p>'+
    '<div class="filters sec"><input type="search" id="pq" placeholder="Find a player…" aria-label="Find a player" value="'+esc(PS.q)+'"><span class="count num" id="pcount"></span></div><div class="tw"><table class="pt"><thead><tr>'+
    cols.map(([k,l])=>'<th data-k="'+k+'" scope="col">'+l+'</th>').join("")+'</tr></thead><tbody id="pbody"></tbody></table></div>';
  const draw=()=>{ const q=PS.q.trim().toLowerCase(); let R=L.filter(p=>!q||p.names.some(n=>n.toLowerCase().includes(q)));
    R=R.slice().sort((a,b)=>{ const x=val(a,PS.sort), y=val(b,PS.sort); return (x<y?-1:x>y?1:0)*PS.dir; });
    $("pcount").textContent=R.length+" of "+L.length;
    document.querySelectorAll(".pt th").forEach(th=>{ if(th.dataset.k===PS.sort) th.setAttribute("aria-sort",PS.dir<0?"descending":"ascending"); else th.removeAttribute("aria-sort"); th.textContent=cols.find(c=>c[0]===th.dataset.k)[1]+(th.dataset.k===PS.sort?(PS.dir<0?" ↓":" ↑"):""); });
    $("pbody").innerHTML=R.map(p=>'<tr data-k="'+esc(p.k)+'"><td><a href="#/p/'+esc(p.k)+'">'+esc(p.n)+'</a>'+(p.b==="cbot"?' <span class="badge">bot</span>':'')+'</td><td class="num">'+p.sessions.length+'</td><td class="num">'+dur(p.st.alive_s||0)+'</td><td class="num">'+(p.st.kills||0)+'</td><td class="num">'+(p.st.deaths||0)+'</td><td class="num">'+kd(p.st.kills||0,p.st.deaths||0)+'</td><td class="num">'+kd(p.st.kills_h||0,p.st.deaths_h||0)+'</td><td class="num">'+(p.st.hits||0)+'</td><td class="num">'+(p.st.parries||0)+'</td></tr>').join(""); };
  document.querySelector(".pt thead").onclick=e=>{ const th=e.target.closest("th"); if(!th) return; const k=th.dataset.k; if(PS.sort===k) PS.dir=-PS.dir; else { PS.sort=k; PS.dir=k==="n"?1:-1; } draw(); };
  $("pbody").onclick=e=>{ const tr=e.target.closest("tr"); if(tr&&!e.target.closest("a")) location.hash="#/p/"+tr.dataset.k; };
  $("pq").oninput=e=>{ PS.q=e.target.value; draw(); };
  draw();
}
async function playerPage(k){
  let L,R; try{ [L,R]=await Promise.all([PLAY(),SESS()]); }catch(e){ return fail(e); }
  const p=L.find(x=>x.k===k); if(!p){ app.innerHTML='<a class="crumb" href="#/players">← Players</a><div class="empty sec">No such player.</div>'; return; }
  document.title=p.n+" · cbot Fight Recordings";
  const st=p.st, rows=R.filter(r=>p.sessions.includes(r.id)), wt=Object.entries(p.weapons), wmax=Math.max(1,...wt.map(w=>w[1]));
  const tiles=[[p.sessions.length,"sessions"],[dur(st.alive_s||0),"fighting"],[st.kills||0,"kills"],[st.deaths||0,"deaths"],[kd(st.kills||0,st.deaths||0),"K/D"],[kd(st.kills_h||0,st.deaths_h||0),"K/D vs humans"],[st.hits||0,"hits landed"],[st.parries||0,"parries"],[st.chambers||0,"chambers"]];
  app.innerHTML='<a class="crumb" href="#/players">← Players</a><div class="shead"><div class="grow"><h1>'+esc(p.n)+(p.b==="cbot"?' <span class="badge">bot</span>':'')+'</h1>'+
    (p.names.length>1?'<p class="lede">Also seen as '+p.names.filter(n=>n!==p.n).map(esc).join(", ")+'</p>':'')+'</div></div>'+
    '<div class="tiles">'+tiles.map(([v,l])=>'<div class="tile"><b>'+esc(v)+'</b><span>'+l+'</span></div>').join("")+'</div>'+
    '<div class="two sec"><section><h2>Best moments</h2>'+(p.moments.length?'<div class="mlist">'+p.moments.map(m=>'<a class="mrow" href="#/s/'+esc(m.s)+'?t='+m.t0+'&f='+m.p+'"><i style="background:'+kc(m.k)+'"></i><b>'+esc(m.title)+'</b><span class="num">'+esc(prettyMap(m.map))+' · '+esc(dur(m.t1-m.t0))+'</span></a>').join("")+'</div>':'<p class="muted">None found yet.</p>')+'</section>'+
    '<section><h2>Weapons</h2>'+(wt.length?'<div class="bars">'+wt.map(([w,s])=>'<div class="brow"><span>'+esc(w)+'</span><div class="tr"><i style="width:'+(100*s/wmax).toFixed(1)+'%"></i></div><span class="v">'+hrs(s)+'</span></div>').join("")+'</div>':'<p class="muted">No weapon time recorded.</p>')+'</section></div>'+
    '<section class="sec"><h2>Sessions</h2><div class="grid" id="pgrid">'+rows.map(sessCard).join("")+'</div></section>';
  bindHeat($("pgrid"),R);
}

// ===== stats: summaries in plain words, then every stats page
async function statsPage(id){
  if(id){ const s=STATS.find(x=>x.id===id); if(!s) return fail("no such page");
    document.title=s.label+" · cbot Fight Recordings";
    app.innerHTML='<a class="crumb" href="#/stats">← Stats</a><div class="shead"><div class="grow"><h1>'+esc(s.label)+'</h1><p class="lede">'+esc(s.blurb)+'</p></div></div><iframe class="sframe" id="sf" title="'+esc(s.label)+'" scrolling="no"></iframe>';
    const f=$("sf"); f.src="stats/"+s.id+".html#"+themeKey;
    const on=ev=>{ if(ev.source!==f.contentWindow||!ev.data) return; if(typeof ev.data.mdFrameHeight==="number"&&ev.data.mdFrameHeight>0) f.style.height=Math.min(Math.max(ev.data.mdFrameHeight,200),9000)+"px"; };
    addEventListener("message",on); const re=()=>{ f.src="stats/"+s.id+".html#"+themeKey; }; themeHooks.push(re);
    page={off(){ removeEventListener("message",on); const k=themeHooks.indexOf(re); if(k>=0) themeHooks.splice(k,1); }}; return; }
  document.title="Stats · cbot Fight Recordings";
  let R,L; try{ [R,L]=await Promise.all([SESS(),PLAY()]); }catch(e){ return fail(e); }
  noteMaps(R);
  const hours=R.reduce((a,r)=>a+r.dur,0)/3600, kills=R.reduce((a,r)=>a+r.kills,0), parries=R.reduce((a,r)=>a+r.parries,0), hum=L.filter(p=>p.b==="human");
  const W={}; hum.forEach(p=>{ for(const [w,s] of Object.entries(p.weapons)) W[w]=(W[w]||0)+s; }); const wt=Object.entries(W).sort((a,b)=>b[1]-a[1]).slice(0,8), wmax=Math.max(1,...wt.map(x=>x[1]));
  const lead=hum.filter(p=>(p.st.kills_h||0)>=15).map(p=>[p,(p.st.kills_h||0)/Math.max(1,p.st.deaths_h||0)]).sort((a,b)=>b[1]-a[1]).slice(0,8), lmax=Math.max(1,...lead.map(x=>x[1]));
  const M={}; R.forEach(r=>M[r.map]=(M[r.map]||0)+r.dur); const mt=Object.entries(M).sort((a,b)=>b[1]-a[1]).slice(0,8), mmax=Math.max(1,...mt.map(x=>x[1]));
  const groups=[]; STATS.forEach(s=>{ let g=groups.find(x=>x.g===s.group); if(!g) groups.push(g={g:s.group,items:[]}); g.items.push(s); });
  const bar=(l,v,mx,txt,href)=>'<div class="brow"><span>'+(href?'<a href="'+href+'">'+esc(l)+'</a>':esc(l))+'</span><div class="tr"><i style="width:'+(100*v/mx).toFixed(1)+'%"></i></div><span class="v">'+esc(txt)+'</span></div>';
  app.innerHTML='<h1>Stats</h1><p class="lede">The short version first. Every chart the recordings feed is under All stats.</p>'+
    '<div class="tiles sec">'+[[R.length,"sessions"],[hours.toFixed(1)+" h","of fights"],[hum.length,"humans"],[kills,"kills"],[parries,"parries"]].map(([v,l])=>'<div class="tile"><b class="num">'+esc(v)+'</b><span>'+l+'</span></div>').join("")+'</div>'+
    '<div class="two sec"><section><h2>Most-used weapons</h2><p class="muted" style="margin:-6px 0 10px;font-size:12.5px">Time humans spent holding each one.</p><div class="bars">'+wt.map(([w,s])=>bar(w,s,wmax,hrs(s))).join("")+'</div></section>'+
    '<section><h2>K/D against humans</h2><p class="muted" style="margin:-6px 0 10px;font-size:12.5px">Players with 15 or more kills on humans.</p><div class="bars">'+lead.map(([p,v])=>bar(p.n,v,lmax,v.toFixed(2),"#/p/"+encodeURIComponent(p.k))).join("")+'</div></section>'+
    '<section><h2>Maps</h2><p class="muted" style="margin:-6px 0 10px;font-size:12.5px">Hours recorded on each.</p><div class="bars">'+mt.map(([m,s])=>bar(mapLabel(m),s,mmax,(s/3600).toFixed(1)+" h")).join("")+'</div></section></div>'+
    '<section class="sec"><h2>All stats</h2>'+groups.map(g=>'<h3 class="muted" style="font-size:12.5px;font-weight:600;margin:16px 0 8px">'+esc(g.g)+'</h3><div class="sgrid">'+g.items.map(s=>'<a class="sc" href="#/stats/'+esc(s.id)+'"><b>'+esc(s.label)+'</b><span>'+esc(s.blurb)+'</span></a>').join("")+'</div>').join("")+'</section>';
}
