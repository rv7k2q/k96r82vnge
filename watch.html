<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fight replay</title>
<style>
:root{--ev-red:#e5383b;--ev-block:#2f6df6;--ev-chamber:#12b8e6;--ev-disarm:#d6336c;--ev-fire:#ff6a13;--hp:#e5383b;--st:#e8a800}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);color:var(--foreground)}
.wrap{display:flex;flex-direction:column;gap:12px;padding:4px 0 8px}
/* layout, wide: the rosters (each team a stacked list of cards) left of the view, the event log (as tall as the view) and
   "up next" right of it, the filters and the second view under it, the description last.
   Medium: rosters left, the log and "up next" side by side under everything. Phone: one column, view first. */
.main{display:grid;gap:14px 20px;grid-template-columns:230px minmax(0,1fr) 300px;grid-template-rows:auto 1fr;
  grid-template-areas:"ros view side" "ros below side";align-items:start}
.view{grid-area:view;min-width:0}
.ros{grid-area:ros;min-width:0}
.below{grid-area:below;display:flex;flex-direction:column;gap:12px;min-width:0}
.side{grid-area:side;display:flex;flex-direction:column;gap:18px;min-width:0}
h2{font-size:15px;font-weight:600;margin:0 0 2px}
.sub{font-size:12.5px;color:var(--muted-foreground);margin:0 0 4px;line-height:1.45}
.sub b{color:var(--foreground);font-weight:600}
.desc{display:grid;grid-template-columns:minmax(0,72ch) minmax(0,1fr);gap:8px 32px;align-items:start;border-top:1px solid var(--border);padding-top:14px;margin-top:4px}
.desc .sub{margin:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted-foreground);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
canvas{display:block;width:100%;border-radius:calc(var(--radius) - 2px);border:1px solid var(--border)}
#cv{position:relative;height:380px;cursor:crosshair;border-bottom-left-radius:0;border-bottom-right-radius:0}
#cs{height:clamp(170px,17vw,300px)}
.hud{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.tcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.th{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding-bottom:4px;border-bottom:1px solid var(--border);margin-bottom:2px}
.th i{width:10px;height:10px;border-radius:3px;flex:none}
.th small{margin-left:auto;font-weight:400;color:var(--muted-foreground);font-size:11px;font-variant-numeric:tabular-nums}
/* a fighter's card: team colour on the left edge; click = follow */
.pl{cursor:pointer;border-radius:calc(var(--radius) - 2px);padding:6px 9px 7px;min-width:0;border:1px solid var(--border);border-left:3px solid var(--tc,var(--border));background:var(--background)}
.pl:hover{background:var(--muted)}
.pl.sel{background:var(--muted);border-color:var(--muted-foreground);border-left-color:var(--tc,var(--muted-foreground))}
/* intention labels (ticket 45): a chip per human (card, first person), the lanes panel under the view (its canvas is inset like the timeline's marks, so times line up) */
.ichip{display:flex;width:max-content;max-width:100%;align-items:center;margin-top:4px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:600;line-height:17px;
  border:1px solid var(--ic,var(--border));color:var(--foreground);background:color-mix(in srgb,var(--ic,var(--muted)) 16%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ichip:empty{display:none}
.ichip.gank{background:var(--ic);color:#141414;border-color:var(--foreground)}
#pvint{margin:0 0 calc(2px*var(--us));font-size:calc(11px*var(--us));line-height:calc(18px*var(--us));pointer-events:none}
#intent{display:flex;flex-direction:column;gap:5px}
#intent[hidden]{display:none}
#intent .ih{display:flex;justify-content:space-between;align-items:baseline;gap:4px 14px;flex-wrap:wrap}
#intent .ih .lab{margin:0}
#ilc{border:0;border-radius:0;margin:0 15px;width:calc(100% - 30px);height:60px;cursor:pointer}
.ikey{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px;color:var(--muted-foreground)}
.ikey span{white-space:nowrap}
.ikey i{display:inline-block;width:11px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
/* many fighters: a compact card, the name and what the fighter is doing on one line, the bars without labels (hover says which) */
.pl.dense{padding:4px 8px 6px}
.pl.dense .nm{display:flex;align-items:baseline;gap:8px}
.pl.dense .nm div{flex:0 1 auto;min-width:0}
.pl.dense .nm span{flex:1 1 0;text-align:right;min-width:0}
.pl.dense .bar{margin-top:3px;gap:5px}
.pl.dense .bar em{display:none}
.pl.dense .bar .tr{height:5px}
