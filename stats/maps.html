<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skirmish map heatmaps</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans)}
.wrap{display:flex;flex-direction:column;gap:26px;padding:4px 0 8px}
h2{font-size:15px;font-weight:600;margin:0 0 2px}
h3{font-size:14px;font-weight:600;margin:0;font-family:var(--font-mono)}
.sub{font-size:12.5px;color:var(--muted-foreground);margin:0;line-height:1.45}
.sub b{color:var(--foreground);font-weight:600}
.meta{font-size:12px;color:var(--muted-foreground);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.meta b{color:var(--foreground);font-weight:600}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted-foreground);flex-wrap:wrap;align-items:center;margin-top:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--chart-2);box-shadow:0 0 0 1.5px var(--background);margin-right:5px;vertical-align:0}
canvas{display:block;width:100%;border-radius:calc(var(--radius) - 2px);cursor:crosshair}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:7px 9px;font-size:11.5px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .08s}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;font-size:12px;align-items:center;margin-top:10px}
.bars .n{font-family:var(--font-mono);font-size:11.5px}
.bars .t{height:12px;border-radius:0 4px 4px 0;background:var(--chart-1)}
.bars .v{color:var(--muted-foreground);font-variant-numeric:tabular-nums;font-size:11.5px}
</style></head><body>
<div id="tip"></div>
<div class="wrap">
  <section>
    <h2>Where people fight on the skirmish maps</h2>
    <p class="sub" id="lede"></p>
    <div class="legend"><span>fewer</span><span id="ramp" style="display:inline-block;width:120px;height:8px;border-radius:4px"></span><span>more time spent (each map on its own scale)</span><span><span class="dot"></span>where someone died</span></div>
    <div class="bars" id="conc"></div>
  </section>
  <div id="maps" class="wrap" style="padding:0"></div>
