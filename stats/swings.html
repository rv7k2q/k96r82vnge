<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swing signatures</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans)}
.wrap{display:flex;flex-direction:column;gap:26px;padding:4px 0 8px}
h2{font-size:15px;font-weight:600;margin:0 0 2px}
h3{font-size:12.5px;font-weight:600;margin:0 0 4px}
.sub{font-size:12.5px;color:var(--muted-foreground);margin:0 0 10px;line-height:1.45}
.sub b{color:var(--foreground);font-weight:600}
svg text{font-family:var(--font-sans)}
.ax{fill:var(--muted-foreground);font-size:10px}
.lbl{fill:var(--foreground);font-size:11px}
.grid line,.grid circle,.grid path{stroke:var(--border);stroke-width:1;fill:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted-foreground);margin:0 0 8px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-left:auto}
.seg button{font:inherit;font-size:11.5px;padding:3px 9px;border:0;background:transparent;color:var(--muted-foreground);cursor:pointer}
.seg button.on{background:var(--muted);color:var(--foreground);font-weight:600}
.row{margin:0 0 14px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.views{grid-template-columns:1fr}}
.hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:7px 9px;font-size:11.5px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .08s;max-width:260px}
#tip b{font-weight:600}
</style></head><body>
<div id="tip"></div>
<div class="wrap">
  <section>
    <h2>Swing signatures</h2>
    <p class="sub" id="lede"></p>

      <span class="seg" id="seg"><button data-w="top" class="on" id="btop"></button><button data-w="all">All weapons</button></span></div>
    <div id="moves"></div>
  </section>
  <section>
    <h2>Strike height</h2>
    <p class="sub" id="polar-sub"></p>
    <div class="legend"><span><i style="background:var(--chart-1)"></i>Humans</span><span><i style="background:var(--chart-2)"></i>cbot</span></div>
    <div id="polar"></div>
  </section>

  const y0=-100,y1=mode==="top"?230:210;
  const h=Math.round(t+b+(y1-y0)*s);
  const svg=el("svg",{width:w,height:h,viewBox:`0 0 ${w} ${h}`});host.appendChild(svg);
  const X=v=>l+(v+220)*s,Y=v=>t+(y1-v)*s;
  const g=el("g",{class:"grid"},svg);
  [-200,-100,0,100,200].forEach(v=>{el("line",{x1:X(v),x2:X(v),y1:t,y2:h-b},g);txt(svg,X(v),h-3,v,"ax","middle")});
  for(let v=Math.ceil(y0/100)*100;v<=y1;v+=100){el("line",{x1:l,x2:w-r,y1:Y(v),y2:Y(v)},g);txt(svg,l-4,Y(v)+3,v,"ax","end")}
  el("circle",{cx:X(0),cy:Y(0),r:100*s},g);
  txt(svg,l+2,10,mode==="top"?"from above (forward ↑, right →)":"from behind (up ↑, right →)","ax");
  el("circle",{cx:X(0),cy:Y(0),r:3,fill:"var(--foreground)"},svg);
  const yi=mode==="top"?0:2;   // coordinate index of screen y: 0 forward, 2 up
  ["cbot","human"].forEach(who=>{
    const E=D.swings[ws][mv][who];if(!E.n)return;
    const key=ws+mv+who;if(!decoded[key])decoded[key]=E.paths.map(dec);
    const gg=el("g",{},svg);
    decoded[key].forEach(p=>{el("polyline",{points:p.map(q=>X(q[1]).toFixed(1)+","+Y(q[yi]).toFixed(1)).join(" "),fill:"none",stroke:COL[who],"stroke-opacity":.07,"stroke-width":1,"stroke-linejoin":"round"},gg)});
    gg.addEventListener("mousemove",e=>showTip(e,`<b>${WHO[who]} · ${NICE[mv]}</b><br>${E.paths.length} of ${fmt(E.n)} swings drawn (faint lines)`));
    gg.addEventListener("mouseleave",hideTip);
  });
  ["cbot","human"].forEach(who=>{
    const E=D.swings[ws][mv][who];if(!E.n)return;
    const pts=E.med.map(q=>[X(q[1]),Y(q[yi])]);
    const ps=pts.map(p=>p.join(",")).join(" ");
    el("polyline",{points:ps,fill:"none",stroke:"var(--background)","stroke-width":6,"stroke-linejoin":"round","stroke-linecap":"round"},svg);
    el("polyline",{points:ps,fill:"none",stroke:COL[who],"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"},svg);
    if(E.rs!=null){const a=Math.round(E.rs*(NPT-1)),b2=Math.round(E.re*(NPT-1));
      el("polyline",{points:pts.slice(a,b2+1).map(p=>p.join(",")).join(" "),fill:"none",stroke:COL[who],"stroke-width":4.5,"stroke-linejoin":"round","stroke-linecap":"round"},svg)}
    el("circle",{cx:pts[0][0],cy:pts[0][1],r:3.5,fill:"var(--background)",stroke:COL[who],"stroke-width":2},svg);
    const hit=el("polyline",{points:pts.map(p=>p.join(",")).join(" "),class:"hit"},svg);
    hit.addEventListener("mousemove",e=>{const rc=svg.getBoundingClientRect();const mx=e.clientX-rc.left,my=e.clientY-rc.top;let bi=0,bd=1e9;pts.forEach((p,i)=>{const d=(p[0]-mx)**2+(p[1]-my)**2;if(d<bd){bd=d;bi=i}});const q=E.med[bi];
      showTip(e,`<b>${WHO[who]} median · ${NICE[mv]}</b><br>${Math.round(bi/(NPT-1)*100)}% through the swing<br>forward ${q[0]} · right ${q[1]} · up ${q[2]} cm<br>${bi>=Math.round((E.rs||0)*(NPT-1))&&bi<=Math.round((E.re||0)*(NPT-1))?"release phase (thick)":"windup / recovery"}`)});
    hit.addEventListener("mouseleave",hideTip);
  });
}

function render(){
  const host=document.getElementById("moves");host.innerHTML="";
  MOVES.forEach(mv=>{
    const h=D.swings[ws][mv],H=h.human,C=h.cbot;
    const row=document.createElement("div");row.className="row";
    row.innerHTML=`<h3>${NICE[mv]} <span style="font-weight:400;color:var(--muted-foreground)">· ${fmt(H.n)} human, ${fmt(C.n)} cbot${C.n<30?" (too few cbot swings to trust)":""}</span></h3><div class="views"><div></div><div></div></div>`;
    host.appendChild(row);
    const v=row.querySelectorAll(".views>div");
    view(v[0],"top",mv);view(v[1],"back",mv);
  });
  lede();
}
// "narrower"/"wider" etc. from a cbot/human ratio, so the sentence stays true when the numbers flip
const wd=(r,lo,hi,same)=>r<0.9?lo:r>1.1?hi:same;
function lede(){
  const S=D.swings[ws],st=(m,w)=>S[m][w].st;
  const both=m=>st(m,"human")&&st(m,"cbot");
  const wlab=ws==="top"?D.top.toLowerCase()+" swings":"swings with any weapon";
  const nH=S.RightStrike.human.n+S.LeftStrike.human.n,nC=S.RightStrike.cbot.n+S.LeftStrike.cbot.n;
  let s=`Each attack's blade tip, from attack start through windup and release (recovery clipped off), in the attacker's body frame (cm from the hips, +forward where the attacker faces), resampled to the same length of time. Faint lines are up to 60 swings per group, thick lines are the median path of all of them, the thick stretch is the release phase (stage 1, inferred from the data). Full-rate rows only, ${wlab}: <b>${fmt(nH)}</b> human and <b>${fmt(nC)}</b> cbot strikes. `;
  if(both("RightStrike")&&both("LeftStrike")){
    const rs=st("RightStrike","human"),rc=st("RightStrike","cbot"),ls=st("LeftStrike","human"),lc=st("LeftStrike","cbot");
    const wide=(rc.wide/rs.wide+lc.wide/ls.wide)/2,reach=(rc.reach/rs.reach+lc.reach/ls.reach)/2;
    s+=`cbot's strikes span <b>${Math.round(wide*100)}%</b> of the human side-to-side width (${wd(wide,"narrower","wider","about the same")}: right strike ${Math.round(rc.wide)} vs ${Math.round(rs.wide)} cm, left ${Math.round(lc.wide)} vs ${Math.round(ls.wide)}) and reach <b>${Math.round(reach*100)}%</b> as far forward. `+
       `The right strike bottoms out ${Math.round(rc.hmin)} cm above the hips for cbot against ${Math.round(rs.hmin)} for humans, and winds up ${Math.round(rc.hmax)} vs ${Math.round(rs.hmax)} cm high. `;
  }
  if(both("Stab")){const sh=st("Stab","human"),sc=st("Stab","cbot");
    s+=`Its stabs span ${Math.round(sc.wide/sh.wide*100)}% of the human width and take <b>${sc.dur.toFixed(2)} s</b> against ${sh.dur.toFixed(2)} s for humans. `}
  s+=`Caveats: cbot has ${fmt(nC)} strikes here against ${fmt(nH)} human, and a median is taken point by point over normalised time, so it is smoother than any single swing.`;
  document.getElementById("lede").innerHTML=s;
}
document.getElementById("seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ws=b.dataset.w;document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));render()});

// ---------- strike height: grouped horizontal bars of the angle field ----------
function bars(){
  const host=document.getElementById("polar");const w=host.clientWidth;
  const hist=D.angle,bw=2/hist.human_strike.length;
  const tot=k=>hist[k].reduce((a,b)=>a+b,0);
  const band=(a,lo,hi)=>a.reduce((s,c,i)=>{const v=-1+(i+.5)*bw;return v>=lo&&v<hi?s+c:s},0);
  const rows=[["Overhead (−0.96)",-1.01,-.5,"strike"],["Level (0)",-.5,.5,"strike"],["Low (+0.8)",.5,1.01,"strike"],["Stabs, angle ≠ 0",null,null,"stab"]];
  const val=(who,r)=>{const a=hist[who+"_"+r[3]],t=tot(who+"_"+r[3]);const c=r[3]==="stab"?t-band(a,-.1,.1):band(a,r[1],r[2]);return [c,t,t?c/t:0]};
  const rowH=44,top=4,L=Math.min(150,w*.34),R=64,gap=14;
  const H=top+rows.length*rowH+gap;const svg=el("svg",{width:w,height:H,viewBox:`0 0 ${w} ${H}`});host.appendChild(svg);
  const sc=(w-L-R)/1;const res=rows.map(r=>({h:val("human",r),c:val("cbot",r)}));
  rows.forEach((r,i)=>{const y=top+i*rowH+(i===3?gap:0);
    if(i===3)el("line",{x1:0,x2:w,y1:y-8,y2:y-8,stroke:"var(--border)"},svg);
    const t=txt(svg,0,y+20,r[0],"lbl");
    ["human","cbot"].forEach((who,j)=>{const [c,n,s]=res[i][who==="human"?"h":"c"];const bwid=Math.max(s*sc,1),yy=y+3+j*18;
      const rad=Math.min(4,bwid/2);
      const b=el("path",{d:`M${L},${yy}h${bwid-rad}a${rad},${rad} 0 0 1 ${rad},${rad}v${14-2*rad}a${rad},${rad} 0 0 1 -${rad},${rad}h-${bwid-rad}z`,fill:COL[who]},svg);
      txt(svg,L+bwid+5,yy+11,(s*100).toFixed(0)+"%","lbl");
      const h=el("rect",{x:L,y:yy-1,width:w-L,height:16,fill:"transparent"},svg);
      h.addEventListener("mousemove",e=>showTip(e,`<b>${WHO[who]} · ${r[0]}</b><br>${fmt(c)} of ${fmt(n)} ${r[3]==="stab"?"stabs":"strikes"} (${(s*100).toFixed(1)}%)`));h.addEventListener("mouseleave",hideTip)})});
  const hc=res.map(x=>x.h[2]),cc=res.map(x=>x.c[2]);
  const hh=D.heights||{};
  const hs=(hh.upper!=null&&hh.middle!=null&&hh.lower!=null)?`, and the human tip height in the release phase falls in that order (about ${hh.upper}, ${hh.middle} and ${hh.lower} cm over the hips), so −1 is an overhead cut and positive is a low one; the true unit is unknown`:"";
  const word=(a,b)=>b===0&&a===0?"the same":(a>b*1.15?"more":a<b*0.85?"fewer":"about as many");
  document.getElementById("polar-sub").innerHTML=
   `<code>angle</code> is the attack motion's AngleTarget, raw. For strikes it holds three values, <b>−0.96</b>, <b>0</b> and <b>+0.80</b>${hs}. Shares of each group's strikes (<b>${fmt(tot("human_strike"))}</b> human, <b>${fmt(tot("cbot_strike"))}</b> cbot): overhead <b>${(hc[0]*100).toFixed(0)}%</b> of human strikes against <b>${(cc[0]*100).toFixed(0)}%</b> of cbot's, level <b>${(hc[1]*100).toFixed(0)}%</b> vs <b>${(cc[1]*100).toFixed(0)}%</b>, low <b>${(hc[2]*100).toFixed(0)}%</b> vs <b>${(cc[2]*100).toFixed(0)}%</b>. cbot throws ${word(cc[0],hc[0])} overhead cuts and ${word(cc[2],hc[2])} low ones, as a share. Stabs: <b>${(hc[3]*100).toFixed(0)}%</b> of human stabs (n ${fmt(tot("human_stab"))}) carry an angle away from 0, the 240-degree stab flick, against <b>${(cc[3]*100).toFixed(0)}%</b> of cbot's (n ${fmt(tot("cbot_stab"))}).`;
}
render();bars();
</script></body></html>
