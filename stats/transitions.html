<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion transitions</title>
<style>
:root{--human:var(--chart-1);--bot:var(--chart-2)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);color:var(--foreground)}
.wrap{display:flex;flex-direction:column;gap:24px;padding:4px 0 8px}
h2{font-size:15px;font-weight:600;margin:0 0 2px}
h3{font-size:13px;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:6px}
h3 i{display:inline-block;width:10px;height:10px;border-radius:3px}
.sub{font-size:12.5px;color:var(--muted-foreground);margin:0 0 10px;line-height:1.45}
.sub b{color:var(--foreground);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.hm{display:grid;grid-template-columns:58px repeat(6,1fr);gap:3px;font-size:11px;align-items:stretch}
.hm .h{color:var(--muted-foreground);font-size:10px;text-align:center;align-self:end;padding-bottom:2px;overflow:hidden}
.hm .r{color:var(--muted-foreground);font-size:10.5px;align-self:center;text-align:right;padding-right:4px;line-height:1.15}
.hm .r small{display:block;font-size:9.5px;opacity:.8}
.c{border-radius:5px;height:38px;position:relative;overflow:hidden;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.c .bg{position:absolute;inset:0}
.c span{position:relative;font-weight:600;font-size:11.5px;font-variant-numeric:tabular-nums;text-shadow:0 0 3px var(--background),0 0 3px var(--background)}
.axl{font-size:10.5px;color:var(--muted-foreground);margin:6px 0 0}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:7px 9px;font-size:11.5px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .08s;max-width:260px}
#tip b{font-weight:600}
.ramp{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted-foreground);margin-top:8px}
.ramp span.b{display:inline-block;width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,transparent,var(--foreground));opacity:.55;border:1px solid var(--border)}
</style></head><body>
<div id="tip"></div>
<div class="wrap">
  <section>
    <h2>What follows what</h2>
    <p class="sub" id="lede"></p>
    <div class="two">
      <div><h3><i style="background:var(--human)"></i>Humans</h3><div class="hm" id="hmH"></div></div>
      <div><h3><i style="background:var(--bot)"></i>cbot</h3><div class="hm" id="hmB"></div></div>
    </div>
    <div class="ramp"><span>0%</span><span class="b"></span><span>60%+ of that row</span><span style="margin-left:6px">Row = what the fighter just did, column = what they did next (within 1.5 s). Cells show the share of the row, labelled from 5%.</span></div>
  </section>
  <section>
    <h2>The biggest gaps</h2>
    <p class="sub" id="l2"></p>
  </section>

const L=D.labels,fmt=n=>n.toLocaleString("en-US");
const tip=document.getElementById("tip");
function showTip(ev,html){tip.innerHTML=html;tip.style.opacity=1;const r=tip.getBoundingClientRect();let x=ev.clientX+14,y=ev.clientY+14;if(x+r.width>innerWidth-6)x=ev.clientX-r.width-14;if(y+r.height>innerHeight-6)y=ev.clientY-r.height-14;tip.style.left=x+"px";tip.style.top=y+"px"}
function hideTip(){tip.style.opacity=0}
const MAXS=0.6;
function build(id,g,color){
  const host=document.getElementById(id);let h='<div></div>'+L.map(l=>`<div class="h">${l}</div>`).join("");
  L.forEach(a=>{const row=D.trans[g][a];const tot=L.reduce((s,b)=>s+row[b],0);
    h+=`<div class="r">${a}<small>n=${fmt(D.seq_from[g][a]||0)}</small></div>`;
    L.forEach(b=>{const v=row[b],sh=tot?v/tot:0;const op=sh?(0.08+0.8*Math.min(1,sh/MAXS)):0;
      h+=`<div class="c" data-a="${a}" data-b="${b}" data-g="${g}"><div class="bg" style="background:${color};opacity:${op.toFixed(2)}"></div>${sh>=0.05?`<span>${Math.round(sh*100)}%</span>`:""}</div>`})});
  host.innerHTML=h;
  host.querySelectorAll(".c").forEach(c=>{const a=c.dataset.a,b=c.dataset.b;const row=D.trans[g][a];const tot=L.reduce((s,x)=>s+row[x],0);const n=D.seq_from[g][a]||0;
    c.addEventListener("mousemove",e=>showTip(e,`<b>${g==="human"?"Humans":"cbot"}: ${a} then ${b}</b><br>${fmt(row[b])} of ${fmt(tot)} follow-ups (${tot?(100*row[b]/tot).toFixed(1):0}%)<br>${n?(100*tot/n).toFixed(0):0}% of ${fmt(n)} ${a.toLowerCase()} starts had any follow-up within 1.5 s`));
    c.addEventListener("mouseleave",hideTip)});
}
build("hmH","human","var(--human)");build("hmB","cbot","var(--bot)");

const T=D.trans;
const rowTot=(g,a)=>L.reduce((s,b)=>s+T[g][a][b],0);
const sh=(g,a,b)=>rowTot(g,a)?T[g][a][b]/rowTot(g,a):0;
const P=x=>Math.round(x*100)+"%";
const P1=x=>(x*100).toFixed(1)+"%";
const atk=["Regular","Combo","Morph","Riposte","Other"];
const sumAtk=(g,f)=>atk.reduce((s,a)=>s+f(g,a),0);
const toCombo=g=>sumAtk(g,rowTot)?atk.reduce((s,a)=>s+T[g][a].Combo,0)/sumAtk(g,rowTot):0;
const follow=(g,a)=>(D.seq_from[g][a]||0)?rowTot(g,a)/D.seq_from[g][a]:0;
const nAtk=g=>atk.reduce((s,a)=>s+(D.seq_from[g][a]||0),0);
const nPar=g=>D.seq_from[g].Parry||0;
const rel=(a,b)=>!b?"about the same":(a/b>1.25?"higher":a/b<0.8?"lower":"about the same");

// the Parry row: which follow-up differs most between humans and cbot
const gaps=L.map(b=>[b,sh("human","Parry",b),sh("cbot","Parry",b)]).sort((x,y)=>Math.abs(y[1]-y[2])-Math.abs(x[1]-x[2]));
const gp=gaps[0];

`How often each kind of move is followed by each other, among fighters' moves that start within 1.5 s of each other (${D.nfiles} recorder-mod files). `+

(function(){
  const hf=follow("human","Regular"),cf=follow("cbot","Regular");

  document.getElementById("l2").innerHTML=
`<b>Combos.</b> Of all attack follow-ups, <b>${P(toCombo("human"))}</b> of the human ones are combos against <b>${P(toCombo("cbot"))}</b> for cbot, on ${fmt(sumAtk("human",rowTot))} and ${fmt(sumAtk("cbot",rowTot))} follow-ups. Out of a plain attack, a combo follows ${P(sh("human","Regular","Combo"))} of the time for humans and ${P(sh("cbot","Regular","Combo"))} for cbot. How often a plain attack is followed by anything at all within 1.5 s: ${P(hf)} for humans, ${P(cf)} for cbot (${rel(cf,hf)} for cbot). A combo leads to another combo ${P(sh("human","Combo","Combo"))} of the time for humans (cbot ${P(sh("cbot","Combo","Combo"))}), and after a riposte they combo ${P(sh("human","Riposte","Combo"))} (cbot ${P(sh("cbot","Riposte","Combo"))}, n = ${fmt(rowTot("cbot","Riposte"))}). cbot's combo and riposte rows have ${nC.Combo||0} and ${nC.Riposte||0} starts${((nC.Combo||0)<100||(nC.Riposte||0)<100)?", so those cells swing a lot":""}.<br><br>`+
`<b>Coverage.</b> A human parry is followed by something within 1.5 s ${P(follow("human","Parry"))} of the time, cbot's ${P(follow("cbot","Parry"))}. cbot makes <b>${nAtk("cbot")?(nPar("cbot")/nAtk("cbot")).toFixed(2):"n/a"}</b> parries per attack, humans <b>${nAtk("human")?(nPar("human")/nAtk("human")).toFixed(2):"n/a"}</b>.<br><br>`+

`A sample as small as cbot's can move either way when files are added.`;
