<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Server recordings</title>
<style>
:root{--human:var(--chart-1);--bot:var(--chart-2)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans)}
.wrap{display:flex;flex-direction:column;gap:28px;padding:4px 0 8px}
h2{font-size:15px;font-weight:600;margin:0 0 2px}
.sub{font-size:12.5px;color:var(--muted-foreground);margin:0 0 10px;line-height:1.45}
.sub b{color:var(--foreground);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius)}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;color:var(--muted-foreground);margin-top:2px}
svg text{font-family:var(--font-sans)}
.ax{fill:var(--muted-foreground);font-size:10.5px}
.lbl{fill:var(--foreground);font-size:11.5px}
.val{fill:var(--muted-foreground);font-size:11px;font-variant-numeric:tabular-nums}
.grid line{stroke:var(--border);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted-foreground);margin:0 0 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:560px){.two{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:7px 9px;font-size:11.5px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .08s;max-width:260px}
#tip b{font-weight:600}
.hit{fill:transparent;cursor:default}
canvas{display:block;width:100%;border-radius:calc(var(--radius) - 2px)}
.mx{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:12px;align-items:stretch}
.mx .h{color:var(--muted-foreground);font-size:11px;text-align:center;align-self:end}
.mx .r{color:var(--muted-foreground);font-size:11px;align-self:center;text-align:right;padding-right:4px}
.cell{border-radius:6px;padding:10px 8px;text-align:center;font-variant-numeric:tabular-nums;position:relative;overflow:hidden;border:1px solid var(--border)}
.cell .bg{position:absolute;inset:0;background:var(--chart-1)}
.cell span{position:relative;font-weight:600;font-size:15px}
.cell small{position:relative;display:block;color:var(--muted-foreground);font-size:10.5px}
</style></head><body>
<div id="tip"></div>
<div class="wrap">
  <section>
    <h2 id="h-title"></h2>
    <p class="sub" id="lede"></p>
    <div class="kpis" id="kpis"></div>
  </section>

  <section>
    <h2>When the recorder ran</h2>
    <p class="sub" id="tl-sub"></p>
    <div id="tl"></div>
  </section>

  <section id="s-heat">
    <h2 id="heat-h"></h2>
    <p class="sub" id="heat-sub"></p>
    <canvas id="heat"></canvas>
    <div class="legend" style="margin-top:8px;align-items:center"><span>fewer</span><span id="ramp" style="display:inline-block;width:120px;height:8px;border-radius:4px"></span><span>more time spent</span><span id="fleg" style="margin-left:10px"><i style="background:none;border:2px solid var(--foreground);border-radius:50%"></i>heal fountain</span></div>
  </section>

  <section>
    <h2>Humans vs cbot: what they swing</h2>
    <p class="sub" id="mv-sub"></p>
    <div class="legend"><span><i style="background:var(--human)"></i>Humans</span><span><i style="background:var(--bot)"></i>cbot</span></div>
    <div class="two"><div id="moves"></div><div id="types"></div></div>
  </section>

  <section class="two">
    <div>
      <h2>Weapons humans fight with</h2>
      <p class="sub" id="wp-sub"></p>
      <div id="weapons"></div>
    </div>
    <div>
      <h2>Who hits whom</h2>
      <p class="sub" id="mx-sub"></p>
      <div class="mx" id="mx"></div>
    </div>
  </section>

  <section id="s-ping">
    <h2>Ping by player</h2>
    <p class="sub">Server-side ping, 10th–90th percentile with the median dot (players with 1,000+ samples).</p>
    <div id="ping"></div>
  </section>

  const g=el("g",{class:"grid"},s);
  for(let t=start;t<=end;t+=3600){const d=new Date(t*1000);const hh=d.getHours();if(hh%6)continue;const x=X(t);el("line",{x1:x,x2:x,y1:4,y2:H-22},g);
    txt(s,x,H-8,hh===0?d.toLocaleDateString("en-US",{month:"short",day:"numeric"}):hh+":00",hh===0?"lbl":"ax","middle")}
  lanes.forEach((ln,i)=>{const y=6+i*30;txt(s,0,y+15,ln,"lbl");
    D.files.filter(f=>f.l===ln).forEach(f=>{const x=X(f.s),x2=X(f.e);const bw=Math.max(3,x2-x);
      const r=el("rect",{x,y:y+3,width:bw,height:18,rx:Math.min(4,bw/2),fill:"var(--chart-1)","fill-opacity":f.hit>0?1:.45},s);
      const hit=el("rect",{x:x-2,y,width:bw+4,height:24,class:"hit"},s);
      const st=new Date(f.s*1000);
      hover(hit,`<b>${f.m}</b><br>${st.toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"})} · ${((f.e-f.s)/60).toFixed(0)} min<br>${f.h} human${f.h==1?"":"s"}, ${f.b} cbot · ${fmt(f.hit)} hits · ${f.mb} MB`)})});
  const faded=D.files.filter(f=>f.hit===0).length;
  document.getElementById("tl-sub").innerHTML=`One bar per file (hover for map, length and who was there), one lane per recording setup, as named in the file name. First file per setup: ${D.lanes.map(l=>`${l.name} (${l.first})`).join(", ")}.`+
    (faded?` <b>${faded}</b> file${faded==1?"":"s"} drawn faded counted no hit events; the older probe DLL logs hits as a different event, which this page does not count.`:"");
})();

// ---------- heatmap ----------
(function(){
  const HM=D.heat;
  if(!HM){document.getElementById("s-heat").style.display="none";return}
  const c=document.getElementById("heat");const [x0,x1,y0,y1]=HM.edges;const G=HM.grid;const n=G.length;
  const nf=HM.fount.length;
  document.getElementById("heat-h").textContent="Where people fight on "+HM.map;
  let verdict="";
  if(nf&&HM.near_share!=null){
    const ratio=HM.near_share/HM.near_area;
    verdict=` Within ${HM.radius/100} m of a fountain: <b>${(HM.near_share*100).toFixed(1)}%</b> of the time, on ${(HM.near_area*100).toFixed(1)}% of the floor anyone stood on, so the fountains see <b>${ratio>1.25?"more":ratio<0.8?"less":"about as much"}</b> traffic than an average spot.`;
  }
  document.getElementById("heat-sub").innerHTML=`Every alive fighter row on <b>${HM.map}</b> (${(HM.rows/1e6).toFixed(1)}M rows from ${HM.files} file${HM.files==1?"":"s"}) as a top-down density map, log scale.${nf?` Rings are the ${nf} heal fountain${nf==1?"":"s"}.`:""} The busiest 10% of the visited floor holds <b>${(HM.top10*100).toFixed(0)}%</b> of all fighter time.${verdict}`;
  if(!nf)document.getElementById("fleg").style.display="none";
  // rotate: screen right = world +Y, screen up = world +X (a rotation, not a mirror)
  const W=c.parentElement.clientWidth;const Hh=Math.round(W*(x1-x0)/(y1-y0));
  const dpr=window.devicePixelRatio||1;c.width=W*dpr;c.height=Hh*dpr;c.style.height=Hh+"px";
  const ctx=c.getContext("2d");ctx.scale(dpr,dpr);
  const css=getComputedStyle(document.documentElement);const col=css.getPropertyValue("--chart-1").trim()||"#3987e5";
  ctx.fillStyle=css.getPropertyValue("--muted").trim()||"#222";ctx.fillRect(0,0,W,Hh);
  const nz=G.flat().filter(v=>v>0).sort((a,b)=>a-b);const q=p=>nz[Math.min(nz.length-1,Math.floor(p*nz.length))];
  const lo=Math.log(q(.05)),hi=Math.log(q(.99));
  const cw=W/n,ch=Hh/n;
  // G[iy][ix]: iy over world y, ix over world x
  for(let iy=0;iy<n;iy++)for(let ix=0;ix<n;ix++){const v=G[iy][ix];if(!v)continue;
    const t=Math.min(1,Math.max(0,(Math.log(v)-lo)/(hi-lo||1)));ctx.globalAlpha=.06+.94*Math.pow(t,1.8);ctx.fillStyle=col;
    ctx.fillRect(iy*cw,(n-1-ix)*ch,cw+.6,ch+.6)}
  ctx.globalAlpha=1;
  const sx=y=>(y-y0)/(y1-y0)*W, sy=x=>(1-(x-x0)/(x1-x0))*Hh;
  ctx.strokeStyle=css.getPropertyValue("--foreground").trim()||"#fff";ctx.lineWidth=2;
  HM.fount.forEach(([x,y])=>{ctx.beginPath();ctx.arc(sx(y),sy(x),7,0,7);ctx.stroke()});
  document.getElementById("ramp").style.background=`linear-gradient(90deg,transparent,${col})`;
  const tot=G.flat().reduce((a,b)=>a+b,0);
  c.addEventListener("mousemove",e=>{const r=c.getBoundingClientRect();const iy=Math.floor((e.clientX-r.left)/r.width*n),ix=n-1-Math.floor((e.clientY-r.top)/r.height*n);
    if(iy<0||ix<0||iy>=n||ix>=n)return hideTip();const v=G[iy][ix];
    const near=HM.fount.some(([x,y])=>Math.hypot(sx(y)-(e.clientX-r.left),sy(x)-(e.clientY-r.top))<10);
    showTip(e,`${near?"<b>Heal fountain</b><br>":""}${fmt(v)} fighter-ticks here<br>${(100*v/tot).toFixed(2)}% of all time on the map`)});
  c.addEventListener("mouseleave",hideTip);
})();

// ---------- moves & types ----------
function grouped(id,title,cats,hv,bv,ht,bt){
  const rowH=40,top=22;const [s,w]=svgIn(id,top+cats.length*rowH);const L=82,R=44;
  txt(s,0,12,title,"lbl");
  const mxv=Math.max(...cats.map(c=>Math.max((hv[c]||0)/ht,(bv[c]||0)/bt)),1e-9);
  cats.forEach((c,i)=>{const y=top+i*rowH;txt(s,0,y+18,c,"lbl");
    [[(hv[c]||0)/ht,"var(--human)","Humans",hv[c]||0,ht],[(bv[c]||0)/bt,"var(--bot)","cbot",bv[c]||0,bt]].forEach(([v,fill,who,n,t],j)=>{
      const bw=v/mxv*(w-L-R);hbar(s,L,y+2+j*16,bw,14,fill);txt(s,L+bw+5,y+13+j*16,(v*100).toFixed(1)+"%","val");
      hover(el("rect",{x:L,y:y+1+j*16,width:w-L,height:16,class:"hit"},s),`<b>${who} · ${c}</b><br>${fmt(n)} of ${fmt(t)} attacks (${(v*100).toFixed(1)}%)`)})});
}
(function(){
  const mh=D.move.human,mb=D.move.cbot,th=D.type.human,tb=D.type.cbot;
  const ht=D.att[0],bt=D.att[1];
  grouped("moves","Attack move, share of attacks",["RightStrike","LeftStrike","Stab","AltStab","Kick"],mh,mb,ht,bt);
  grouped("types","Attack type, share of attacks",["Regular","Combo","Morph","Riposte"],th,tb,ht,bt);
  const ph=D.parry.human/ht,pb=D.parry.cbot/bt;
  const g=(o,k,t)=>(o[k]||0)/t;
  // each clause states both numbers and the direction is computed from them
  const clause=(verb,k,bo,ho)=>`cbot ${verb} <b>${rel(g(bo,k,bt),g(ho,k,ht))}</b> (${pct(bo[k]||0,bt)} vs ${pct(ho[k]||0,ht)})`;
  document.getElementById("mv-sub").innerHTML=`Every attack start by its EAttackMove and EAttackType (${fmt(ht)} human, ${fmt(bt)} cbot). `+
    [clause("stabs","Stab",mb,mh),clause("alt-stabs","AltStab",mb,mh),clause("combos","Combo",tb,th),clause("morphs","Morph",tb,th),clause("ripostes","Riposte",tb,th)].join("; ")+
    `. It parries <b>${rel(pb,ph)}</b> for each swing it throws: <b>${pb.toFixed(2)}</b> parries per attack against ${ph.toFixed(2)} for humans. Where the two shares are within a quarter of each other the clause says "about as often".`;
})();

// ---------- weapons ----------
(function(){
  const W=D.weapons.map(([n,v])=>[n.replace(/^BP_/,"").replace(/_NC$/,"").replace("2HMace","Two-handed mace"),v]);
  if(!W.length){document.getElementById("wp-sub").textContent="No weapon data.";return}
  const tot=W.reduce((a,b)=>a+b[1],0);const rowH=22;const [s,w]=svgIn("weapons",W.length*rowH);const L=104,R=40;const mxv=W[0][1];
  W.forEach(([n,v],i)=>{const y=i*rowH;txt(s,0,y+14,n,"lbl");const bw=v/mxv*(w-L-R);hbar(s,L,y+3,bw,14,"var(--human)");txt(s,L+bw+5,y+14,fmt(v),"val");
    hover(el("rect",{x:0,y,width:w,height:rowH,class:"hit"},s),`<b>${n}</b><br>${fmt(v)} human attacks`)});
  document.getElementById("wp-sub").innerHTML=`Human attack starts by held weapon. The <b>${W[0][0]}</b> alone is ${pct(W[0][1],D.att[0])} of all human swings.`;
})();

// ---------- hit matrix ----------
(function(){
  const P=D.pair;const g=(a,b)=>P[a+">"+b]||0;const vals=[["human","human"],["human","cbot"],["cbot","human"],["cbot","cbot"]].map(([a,b])=>g(a,b));const mxv=Math.max(...vals,1);
  const cell=(a,b)=>{const v=g(a,b);return `<div class="cell" data-t="${a==="human"?"Humans":"cbot"} hitting ${b==="human"?"humans":"cbot"}: ${fmt(v)}"><div class="bg" style="opacity:${(.12+.75*Math.sqrt(v/mxv)).toFixed(2)}"></div><span>${fmt(v)}</span></div>`};
  document.getElementById("mx").innerHTML=`<div></div><div class="h">on a human</div><div class="h">on cbot</div><div class="r">Human hits</div>${cell("human","human")}${cell("human","cbot")}<div class="r">cbot hits</div>${cell("cbot","human")}${cell("cbot","cbot")}`;
  document.querySelectorAll("#mx .cell").forEach(c=>hover(c,c.dataset.t+" hits"));
  const hc=g("human","cbot"),ch=g("cbot","human"),hs=g("human","stock"),sh=g("stock","human");
  const rc=ch?hc/ch:null,rs=sh?hs/sh:null;
  let s=`Hit events by attacker and victim. `;
  s+=rc!=null?`Humans land <b>${rc.toFixed(1)}×</b> as many hits on cbot as cbot lands on them (${fmt(hc)} vs ${fmt(ch)}). `:`Humans landed ${fmt(hc)} hits on cbot; cbot landed none on humans. `;
  if(rs!=null&&rc!=null){const d=rc/rs;s+=`Against Mordhau's stock bots the ratio is <b>${rs.toFixed(1)}×</b> (${fmt(hs)} vs ${fmt(sh)}), so cbot trades <b>${d<0.8?"better":d>1.25?"worse":"about the same"}</b> against humans as the stock bots do.`}
  document.getElementById("mx-sub").innerHTML=s;
})();

// ---------- ping ----------
(function(){
  const P=D.pings;
  if(!P.length){document.getElementById("s-ping").style.display="none";return}
  const rowH=24;const [s,w]=svgIn("ping",P.length*rowH+18);const L=96,R=16;const mxv=Math.ceil(Math.max(...P.map(p=>p[3]))/20)*20;
  const X=v=>L+v/mxv*(w-L-R);const g=el("g",{class:"grid"},s);
  for(let v=0;v<=mxv;v+=20){el("line",{x1:X(v),x2:X(v),y1:0,y2:P.length*rowH},g);txt(s,X(v),P.length*rowH+13,v+" ms","ax","middle")}
  P.forEach(([n,a,m,b,c],i)=>{const y=i*rowH+12;txt(s,0,y+4,n,"lbl");
    el("line",{x1:X(a),x2:X(b)+.01,y1:y,y2:y,stroke:"var(--human)","stroke-width":4,"stroke-linecap":"round","stroke-opacity":.45},s);
    el("circle",{cx:X(m),cy:y,r:5,fill:"var(--human)",stroke:"var(--background)","stroke-width":2},s);
    hover(el("rect",{x:0,y:y-12,width:w,height:rowH,class:"hit"},s),`<b>${n}</b><br>median ${m} ms · p10 ${a} · p90 ${b}<br>${fmt(c)} samples`)});
})();
</script></body></html>
