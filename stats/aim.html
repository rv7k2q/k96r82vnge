<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aim tracking</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans)}
.wrap{display:flex;flex-direction:column;gap:26px;padding:4px 0 8px}
h2{font-size:15px;font-weight:600;margin:0 0 2px}
h3{font-size:12.5px;font-weight:600;margin:0 0 4px}
.sub{font-size:12.5px;color:var(--muted-foreground);margin:0 0 10px;line-height:1.45}
.sub b{color:var(--foreground);font-weight:600}
svg text{font-family:var(--font-sans)}
.ax{fill:var(--muted-foreground);font-size:10.5px}
.lbl{fill:var(--foreground);font-size:11px}
.grid line{stroke:var(--border);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted-foreground);margin:0 0 8px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:16px;height:0;border-top:3px solid;margin-right:5px;vertical-align:3px}
.legend i.d{border-top-style:dashed}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-left:auto}
.seg button{font:inherit;font-size:11.5px;padding:3px 9px;border:0;background:transparent;color:var(--muted-foreground);cursor:pointer}
.seg button.on{background:var(--muted);color:var(--foreground);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted-foreground);text-align:right;padding:4px 6px;border-bottom:1px solid var(--border);font-size:11px}
td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
td i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.tw{overflow-x:auto}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:7px 9px;font-size:11.5px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .08s;max-width:270px}
#tip b{font-weight:600}
</style></head><body>
<div id="tip"></div>
<div class="wrap">
  <section>
    <h2>Aim tracking before a swing lands</h2>
    <p class="sub" id="lede"></p>
    <div class="legend"><span><i style="border-color:var(--chart-1)"></i>Humans</span><span><i style="border-color:var(--chart-2)"></i>cbot</span>
      <span><i style="border-color:var(--foreground)"></i>landed hit</span><span><i class="d" style="border-color:var(--foreground)"></i>no hit</span>
      <span class="seg" id="seg"><button data-m="yaw" class="on">Yaw error</button><button data-m="pitch">Pitch error</button></span></div>
    <h3>How big the error is</h3>
    <p class="sub" id="cdf-sub"></p>
    <div id="cdf"></div>
  </section>
  <section>
    <h2>Error by time before impact</h2>
    <p class="sub" id="time-sub"></p>
    <div class="two"><div><h3>Landed hits</h3><div id="t-hit"></div></div><div><h3>Swings that did not land</h3><div id="t-miss"></div></div></div>
  </section>
  <section>
    <h2>The numbers</h2>
    <p class="sub" id="tab-sub"></p>
    <div class="tw" id="tab"></div>
  </section>

    document.getElementById("lede").innerHTML=`Pitch against the opponent's head bone: the camera is <b>${hh.medp.toFixed(1)}°</b> off at the median for humans on a landed hit (${hm.medp.toFixed(1)}° on no-hit swings) and <b>${ch.medp.toFixed(1)}°</b> for cbot (${cm.medp.toFixed(1)}° on no-hit swings). At melee range one degree is a couple of centimetres of height. ${cap}`;
    document.getElementById("cdf-sub").innerHTML=`Cumulative share of swings by |pitch error| (0.5° steps). Share within 2°: humans ${(g("human","hit").pecdf[4]*100).toFixed(0)}% on hits and ${(g("human","miss").pecdf[4]*100).toFixed(0)}% on misses, cbot ${(g("cbot","hit").pecdf[4]*100).toFixed(0)}% and ${(g("cbot","miss").pecdf[4]*100).toFixed(0)}%.`;
    document.getElementById("time-sub").innerHTML=`Median |pitch error| with the middle half shaded. Human hits go from ${hh.pitch[0][1]}° to ${hh.pitch[hh.pitch.length-1][1]}°, human misses from ${hm.pitch[0][1]}° to ${hm.pitch[hm.pitch.length-1][1]}°.`;
  }
}

function render(){cdf();timeChart("t-hit","hit");timeChart("t-miss","miss");table();text()}
document.getElementById("seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;M=b.dataset.m;document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));render()});
render();
</script></body></html>
