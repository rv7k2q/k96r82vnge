<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Footwork, humans vs cbot</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);color:var(--foreground)}
.wrap{display:flex;flex-direction:column;gap:28px;padding:4px 0 8px}
h2{font-size:15px;font-weight:600;margin:0 0 2px}
.sub{font-size:12.5px;color:var(--muted-foreground);margin:0 0 10px;line-height:1.45}
.sub b{color:var(--foreground);font-weight:600}
.note{font-size:11.5px;color:var(--muted-foreground);margin:8px 0 0;line-height:1.4}
svg{display:block}
svg text{font-family:var(--font-sans)}
.ax{fill:var(--muted-foreground);font-size:10.5px}
.lbl{fill:var(--foreground);font-size:11.5px}
.val{fill:var(--muted-foreground);font-size:11px;font-variant-numeric:tabular-nums}
.grid line{stroke:var(--border);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted-foreground);margin:0 0 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:7px 9px;font-size:11.5px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .08s;max-width:260px}
#tip b{font-weight:600}
.hit{fill:transparent;cursor:default}

.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.ph{font-size:12px;font-weight:600;margin:0 0 4px}
.ph span{font-weight:400;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.ramp{display:inline-block;width:90px;height:8px;border-radius:4px;vertical-align:middle;margin:0 6px}
</style></head><body>
<div id="tip"></div>
<div class="wrap">
  <section>
    <h2>Where do the feet go?</h2>
    <p class="sub" id="lede"></p>
    <div class="legend"><span><i style="background:var(--chart-1)"></i>Humans</span><span><i style="background:var(--chart-2)"></i>cbot</span><span id="rampleg"></span></div>
    <div class="panels" id="panels"></div>
    <p class="note" id="pnote"></p>
  </section>
  <section>
    <h2>Share of time standing, strafing, backing up</h2>
    <p class="sub" id="share-sub"></p>
    <div class="legend"><span><i style="background:var(--chart-1)"></i>Humans</span><span><i style="background:var(--chart-2)"></i>cbot</span></div>
    <div class="two"><div id="sh-windup"></div><div id="sh-neutral"></div></div>
  </section>

      hover(el("rect",{x:L,y:y+2+j*17,width:w-L,height:16,class:"hit"},s),`<b>${WHO[wh][0]}, ${CAT[ci].toLowerCase()}</b><br>${PCT(v)} of ${CTX[cx]} rows<br>${fmt(D.cat[wh+"|"+cx][ci])} of ${fmt(D.cat[wh+"|"+cx].reduce((p,q)=>p+q,0))}`)})});
}
shares("sh-windup","windup");shares("sh-neutral","neutral");

const hw=sh("human","windup"),cw_=sh("cbot","windup"),hn=sh("human","neutral"),cn=sh("cbot","neutral");
// a cbot share against the human one: "more", "less" or "about the same" (15% band), always with both numbers
const vs=(c,h)=>`${PCT(c)} for cbot against ${PCT(h)} for humans (<b>${rel(c,h)}</b>)`;
document.getElementById("lede").innerHTML=`Movement input of every living fighter with an opponent within 500 cm, split into attack windups and neutral (no motion): ${fmt(G["human|windup"].n)} human and ${fmt(G["cbot|windup"].n)} cbot windup rows, ${fmt(G["human|neutral"].n)} and ${fmt(G["cbot|neutral"].n)} neutral rows. `+
 `<b>In neutral</b>, standing still: ${vs(cn[0],hn[0])}; backing up: ${vs(cn[3],hn[3])}. `+
 `<b>During a windup</b>, standing still: ${vs(cw_[0],hw[0])}; backing up: ${vs(cw_[3],hw[3])}; strafing only: ${vs(cw_[2],hw[2])}.`;
document.getElementById("share-sub").innerHTML=`Each row is classified by input with a ${D.dz} dead zone: still = no input, backward = any backward input (diagonals included), forward = any forward input (diagonals included), strafing only = sideways with no forward or back. In windups cbot stands still <b>${hw[0]?(cw_[0]/hw[0]).toFixed(1):"n/a"}x</b> as much as humans do (cbot share divided by human share) and backs up <b>${hw[3]>=cw_[3]?(cw_[3]?(hw[3]/cw_[3]).toFixed(1):"n/a")+"x</b> less":(hw[3]?(cw_[3]/hw[3]).toFixed(1):"n/a")+"x</b> more"}. Windup means the attack's first stage (stage 0, before release), inferred from the data. Behind the windup rows are ${D.players["human|windup"]} human and ${D.players["cbot|windup"]} cbot distinct player names across ${D.nfiles} recordings; one or two busy players can dominate a group.`;
