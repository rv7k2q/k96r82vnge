const mx=Math.ceil(Math.max(...K.map(r=>Math.max(kd(r),okd(r))))*2)/2;const X=v=>L+v/mx*(w-L-R);
const g=el("g",{class:"grid"},s);
for(let v=0;v<=mx+1e-9;v+=0.5){el("line",{x1:X(v),x2:X(v),y1:T0,y2:T0+K.length*rowH},g);txt(s,X(v),H-5,v===1?"1.0 even":v.toFixed(1),"ax","middle")}
el("line",{x1:X(1),x2:X(1),y1:T0,y2:T0+K.length*rowH,stroke:"var(--muted-foreground)","stroke-width":1,"stroke-dasharray":"3 3"},s);
K.forEach((r,i)=>{const y=T0+i*rowH,cy=y+rowH/2;const v=kd(r),bw=Math.max(1,X(v)-L),rr=Math.min(4,bw);
  txt(s,0,cy+4,r.n,"lbl");
  el("path",{d:`M${L},${cy-7}h${bw-rr}a${rr},${rr} 0 0 1 ${rr},${rr}v${14-2*rr}a${rr},${rr} 0 0 1 -${rr},${rr}h-${bw-rr}z`,fill:"var(--chart-1)"},s);
  if(r.od) el("circle",{cx:X(okd(r)),cy,r:5,fill:"none",stroke:"var(--muted-foreground)","stroke-width":2},s);
  txt(s,w-R+8,cy+4,`${v.toFixed(2)}   ${r.k}–${r.d}`,"val");
  const h=el("rect",{x:0,y,width:w,height:rowH,class:"hit"},s);
  h.addEventListener("mousemove",e=>show(e,`<b>${r.n}</b> · K/D vs humans <b>${v.toFixed(2)}</b><br>${r.k} kills on humans, ${r.d} deaths to humans`+
    `<br><span class="m">left out: ${r.kc} cbot kills, ${r.ks} stock-bot or unidentified kills, ${r.dc} deaths to bots, ${r.dn} deaths nobody was credited for</span>`+
    (r.od?`<br><span class="m">scoreboard: ${r.ok}–${r.od} (${okd(r).toFixed(2)})</span>`:"")));
  h.addEventListener("mouseleave",()=>tip.style.opacity=0)});
const kc=K.reduce((a,r)=>a+r.kc,0),ks=K.reduce((a,r)=>a+r.ks,0);
const hasSb=K.some(r=>r.od>0);
if(!hasSb)document.getElementById("sbleg").style.display="none";
// the player whose scoreboard K/D moves most once bots are taken out
const mover=hasSb?K.filter(r=>r.od>0).sort((a,b)=>Math.abs(okd(b)-kd(b))-Math.abs(okd(a)-kd(a)))[0]:null;
document.getElementById("sub").innerHTML=`Only kills where both players are human, in every recorded match with a scoreboard; players with ${DD.min}+ human kills and deaths are listed. The ${kc} cbot kills and ${ks} stock-bot kills by these players are left out, and so are deaths to bots. `+
  (mover&&Math.abs(okd(mover)-kd(mover))>=0.05?`The biggest change is <b>${mover.n}</b>: the scoreboard K/D (${mover.ok}–${mover.od}, every kill counted) is ${okd(mover).toFixed(2)}; against humans it is <b>${kd(mover).toFixed(2)}</b> (${mover.k}–${mover.d}). `:"")+
  `Hover a row for what was left out.`;
</script></body></html>
