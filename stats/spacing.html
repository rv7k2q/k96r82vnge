<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spacing, humans vs cbot</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);color:var(--foreground)}
.wrap{display:flex;flex-direction:column;gap:28px;padding:4px 0 8px}
h2{font-size:15px;font-weight:600;margin:0 0 2px}
.sub{font-size:12.5px;color:var(--muted-foreground);margin:0 0 10px;line-height:1.45}
.sub b{color:var(--foreground);font-weight:600}
.note{font-size:11.5px;color:var(--muted-foreground);margin:8px 0 0;line-height:1.4}
svg{display:block}
svg text{font-family:var(--font-sans)}
.ax{fill:var(--muted-foreground);font-size:10.5px}
.lbl{fill:var(--foreground);font-size:11.5px}
.val{fill:var(--muted-foreground);font-size:11px;font-variant-numeric:tabular-nums}
.grid line{stroke:var(--border);stroke-width:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted-foreground);margin:0 0 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:7px 9px;font-size:11.5px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .08s;max-width:260px}
#tip b{font-weight:600}
.hit{fill:transparent;cursor:default}

</style></head><body>
<div id="tip"></div>
<div class="wrap">
  <section>
    <h2>How far apart do they swing?</h2>
    <p class="sub" id="lede"></p>
    <div class="legend"><span><i style="background:var(--chart-1)"></i>Humans (up)</span><span><i style="background:var(--chart-2)"></i>cbot (down)</span><span>Each side is that group's own share of attacks per 10 cm, so a small sample is not drowned out.</span></div>
    <div id="ridge"></div>
    <p class="note" id="drops"></p>
  </section>
  <section>
    <h2>How far apart when a hit lands</h2>
    <p class="sub" id="hit-sub"></p>
    <div id="hits"></div>
  </section>

<script>

const NS="http://www.w3.org/2000/svg";
const fmt=n=>n.toLocaleString("en-US");
const tip=document.getElementById("tip");
function showTip(ev,html){tip.innerHTML=html;tip.style.opacity=1;const r=tip.getBoundingClientRect();let x=ev.clientX+14,y=ev.clientY+14;if(x+r.width>innerWidth-6)x=ev.clientX-r.width-14;if(y+r.height>innerHeight-6)y=ev.clientY-r.height-14;if(x<4)x=4;tip.style.left=x+"px";tip.style.top=y+"px"}
function hideTip(){tip.style.opacity=0}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function txt(parent,x,y,s,cls,anchor){const t=el("text",{x,y,class:cls||"ax","text-anchor":anchor||"start"},parent);t.textContent=s;return t}
function hover(node,html){node.addEventListener("mousemove",e=>showTip(e,typeof html==="function"?html(e):html));node.addEventListener("mouseleave",hideTip)}
function svgIn(id,h){const host=document.getElementById(id);const w=Math.max(200,host.clientWidth);const s=el("svg",{width:w,height:h,viewBox:`0 0 ${w} ${h}`});host.appendChild(s);return [s,w]}
function hbar(p,x,y,w,h,fill){w=Math.max(w,1);const r=Math.min(4,w,h/2);return el("path",{d:`M${x},${y}h${w-r}a${r},${r} 0 0 1 ${r},${r}v${h-2*r}a${r},${r} 0 0 1 -${r},${r}h-${w-r}z`,fill},p)}
// "more"/"less"/"about the same" for a/b, so a lede stays true when the numbers flip
function rel(a,b,more,less,same){if(!b)return same||"about the same";const r=a/b;return r>1.15?(more||"more"):r<0.87?(less||"less"):(same||"about the same")}

const C1="var(--chart-1)",C2="var(--chart-2)";
const MVN={RightStrike:"Right strike",LeftStrike:"Left strike",Stab:"Stab",AltStab:"Alt stab",Kick:"Kick"};
const NB=D.human[0].h.length,BW=D.edges[2],XMAX=D.edges[1];
function smooth(h,n){const o=h.map((v,i)=>{const a=h[Math.max(0,i-1)],c=h[Math.min(h.length-1,i+1)];return (a+2*v+c)/4});return o.map(v=>v/Math.max(n,1))}
function ridge(id,rows,opts){
  const HH=34,HEAD=18,PAD=12,rowH=HEAD+HH*2+PAD,L=6,R=10,AX=20;
  const [s,w]=svgIn(id,rows.length*rowH+AX);
  const X=v=>L+v/XMAX*(w-L-R);
  const sm=rows.map(r=>[smooth(r.h.h,r.h.n),smooth(r.c.h,r.c.n)]);
  const mx=opts.max||Math.max(...sm.flat().flat());
  const g=el("g",{class:"grid"},s);
  for(let v=0;v<=XMAX;v+=100){el("line",{x1:X(v),x2:X(v),y1:0,y2:rows.length*rowH},g);txt(s,X(v),rows.length*rowH+14,v===0?"0":v===XMAX?XMAX+" cm":v,"ax",v===0?"start":(v===XMAX?"end":"middle"))}
  rows.forEach((r,i)=>{
    const y0=i*rowH+HEAD+HH; // baseline
    txt(s,L,i*rowH+12,r.name,"lbl");
    txt(s,w-R,i*rowH+12,`n = ${fmt(r.h.n)} human, ${fmt(r.c.n)} cbot`,"val","end");
    el("line",{x1:L,x2:w-R,y1:y0,y2:y0,stroke:"var(--border)","stroke-width":1.5},s);
    [[sm[i][0],-1,C1,r.h],[sm[i][1],1,C2,r.c]].forEach(([d,sg,col,o])=>{
      let p=`M${X(0)},${y0}`;d.forEach((v,k)=>{p+=`L${X((k+.5)*BW)},${y0+sg*v/mx*(HH-3)}`});p+=`L${X(XMAX)},${y0}Z`;
      el("path",{d:p,fill:col,"fill-opacity":.55,stroke:col,"stroke-width":1.4,"stroke-linejoin":"round"},s);
      if(o.med!=null&&o.n>=30){const x=X(o.med);el("line",{x1:x,x2:x,y1:y0,y2:y0+sg*(HH-2),stroke:col,"stroke-width":2},s);
        const right=x<w-60;txt(s,right?x+4:x-4,y0+sg*(HH-5)+(sg<0?-1:5),`${Math.round(o.med)}`,"lbl",right?"start":"end").setAttribute("style","font-weight:600")}
      else if(o.n<30) txt(s,w-R,y0+sg*(HH-8),`too few (n=${o.n})`,"val","end");
    });
    const hit=el("rect",{x:0,y:i*rowH,width:w,height:rowH,class:"hit"},s);
    hover(hit,e=>{const b=s.getBoundingClientRect();const v=(e.clientX-b.left-L)/(w-L-R)*XMAX;const k=Math.max(0,Math.min(NB-1,Math.floor(v/BW)));
      const f=(o)=>o.n?`${(100*o.h[k]/o.n).toFixed(1)}% (${fmt(o.h[k])})`:"-";
      return `<b>${r.name}</b>, ${k*BW}-${(k+1)*BW} cm<br><span style="color:${C1}">&#9632;</span> humans ${f(r.h)}<br><span style="color:${C2}">&#9632;</span> cbot ${f(r.c)}<br>median ${r.h.med!=null?Math.round(r.h.med):"-"} vs ${r.c.med!=null?Math.round(r.c.med):"-"} cm`});
  });
}
const rows=D.moves.map((m,i)=>({name:MVN[m],h:D.human[i],c:D.cbot[i]}));
const gmax=Math.max(...rows.map(r=>[smooth(r.h.h,r.h.n),smooth(r.c.h,r.c.n)]).flat(2),...[smooth(D.hit_human.h,D.hit_human.n),smooth(D.hit_cbot.h,D.hit_cbot.n)].flat());
ridge("ridge",rows,{max:gmax});
ridge("hits",[{name:"At the moment of a hit (attacker to victim)",h:D.hit_human,c:D.hit_cbot}],{max:gmax});

// ledes: every direction below is computed from the medians
const tot=w=>D[w].reduce((a,m)=>a+m.n,0),drp=w=>D[w].reduce((a,m)=>a+m.drop,0);
const m=(w,i)=>D[w][i].med==null?null:Math.round(D[w][i].med);
const usable=i=>D.cbot[i].n>=30&&D.human[i].n>=30;
const cmpPhrase=(i)=>{const c=D.cbot[i].med,h=D.human[i].med;const d=c-h;return Math.abs(d)<10?"about the same":`${Math.abs(Math.round(d))} cm ${d<0?"closer":"farther"} for cbot`};
const parts=[0,1,2].filter(usable).map(i=>`${MVN[D.moves[i]].toLowerCase()} median ${m("human",i)} cm for humans and ${m("cbot",i)} for cbot (${cmpPhrase(i)})`);
const rare=[3,4].filter(i=>D.cbot[i].n<30).map(i=>`${MVN[D.moves[i]].toLowerCase()} (${D.cbot[i].n} cbot attacks)`);
const allMed=w=>{const a=D[w].filter(r=>r.med!=null&&r.n>=30).map(r=>r.med);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length/100*10)/10:null};
document.getElementById("lede").innerHTML=`Horizontal distance from the attacker to the nearest living opponent at the first tick of each attack (${fmt(tot("human"))} human, ${fmt(tot("cbot"))} cbot). `+
  (parts.length?`<b>Medians</b>: ${parts.join("; ")}. `:"")+
  (rare.length?`${rare.join(" and ")} are too rare for cbot to say anything. `:"")+
  (allMed("human")!=null&&allMed("cbot")!=null?`On average across the moves, humans start swings from about ${allMed("human")} m and cbot from about ${allMed("cbot")} m.`:"");
document.getElementById("drops").innerHTML=`Dropped: attacks with no living opponent within ${XMAX} cm, <b>${fmt(drp("human"))}</b> of ${fmt(tot("human")+drp("human"))} human attacks (${(100*drp("human")/Math.max(1,tot("human")+drp("human"))).toFixed(1)}%) and <b>${fmt(drp("cbot"))}</b> of ${fmt(tot("cbot")+drp("cbot"))} cbot attacks (${(100*drp("cbot")/Math.max(1,tot("cbot")+drp("cbot"))).toFixed(1)}%). Opponents are every other living fighter on free-for-all maps and the other team on team maps (stock bots count as opponents); a thinned far-away fighter counts for up to 30 ticks after its last row. Numbers on the plot are medians in cm. ${D.nfiles} recorder-mod files, ${D.range}.`;
const hh=D.hit_human,hc=D.hit_cbot;
const swingMed=(w)=>{const n=D[w].slice(0,3).reduce((a,r)=>a+r.n,0);return n?D[w].slice(0,3).reduce((a,r)=>a+(r.med||0)*r.n,0)/n:null};
const sh=swingMed("human"),sc=swingMed("cbot");
document.getElementById("hit-sub").innerHTML=`Distance between attacker and victim at the tick of the hit event (${fmt(hh.n)} human hits, ${fmt(hc.n)} cbot hits; ${hh.drop+hc.drop} dropped for a missing position or over ${XMAX} cm). `+
  (hh.med!=null&&sh!=null?`Hits land from ${hh.med<sh*0.8?"much closer than":hh.med>sh*1.2?"farther than":"about the same distance as"} swings start: humans at a median of <b>${Math.round(hh.med)} cm</b> (middle half ${Math.round(hh.q25)}-${Math.round(hh.q75)}), `:"")+
  (hc.med!=null?`cbot at <b>${Math.round(hc.med)} cm</b> (${Math.round(hc.q25)}-${Math.round(hc.q75)})${hh.med!=null?`, ${Math.abs(Math.round(hh.med-hc.med))} cm ${hc.med<hh.med?"closer":"farther"} than humans`:""}${hc.n<200?`, but there are only ${hc.n} of them`:""}. `:"No cbot hits. ")+
  `Hits with no usable attacker or victim (${D.hit_skipped["no attacker/victim"]||0}) and hits by stock bots (${D.hit_skipped.stock||0}) are left out.`;
