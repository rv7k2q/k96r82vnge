"Other":8,"Parry":672},"Riposte":{"Regular":999,"Combo":1088,"Morph":0,"Riposte":0,"Other":58,"Parry":1060},"Other":{"Regular":14,"Combo":95,"Morph":0,"Riposte":0,"Other":0,"Parry":5},"Parry":{"Regular":3706,"Combo":0,"Morph":0,"Riposte":6649,"Other":0,"Parry":1047}},"cbot":{"Regular":{"Regular":259,"Combo":137,"Morph":230,"Riposte":0,"Other":3,"Parry":197},"Combo":{"Regular":27,"Combo":17,"Morph":0,"Riposte":0,"Other":0,"Parry":9},"Morph":{"Regular":70,"Combo":17,"Morph":0,"Riposte":0,"Other":1,"Parry":21},"Riposte":{"Regular":14,"Combo":33,"Morph":0,"Riposte":0,"Other":2,"Parry":18},"Other":{"Regular":3,"Combo":1,"Morph":0,"Riposte":0,"Other":0,"Parry":0},"Parry":{"Regular":444,"Combo":0,"Morph":0,"Riposte":218,"Other":0,"Parry":109}}},"seq_from":{"human":{"Regular":28236,"Parry":15155,"Morph":5163,"Combo":5791,"Riposte":6720,"Other":198},"cbot":{"Regular":1955,"Parry":1270,"Combo":209,"Morph":231,"Riposte":218,"Other":6}},"seq_next":{"human":{"Regular":18688,"Parry":11402,"Morph":3138,"Combo":2827,"Riposte":3205,"Other":114},"cbot":{"Regular":826,"Parry":771,"Riposte":67,"Other":4,"Morph":109,"Combo":53}},"type_n":{"human":{"Regular":28236,"Morph":5163,"Combo":5791,"Riposte":6720,"Other":198},"cbot":{"Regular":1955,"Combo":209,"Morph":231,"Riposte":218,"Other":6}},"hit_victims":{"known":12789,"unknown":3},"nfiles":120,"overview":{"folder":"E:\\mordnn-data\\server-recordings","files":144,"http_files":122,"hours":20.200136185685793,"range":"Nov 15\u201321, 2026","first_date":"2026-11-15","last_date":"2026-11-21","attacks":{"human":52231,"cbot":6426},"type_share":{"human":{"Combo":0.12574907621910358,"Riposte":0.14330569968026652},"cbot":{"Combo":0.06349206349206349,"Riposte":0.08590102707749767}},"hits_by":{"cbot>human":332,"human>cbot":1347,"stock>human":69,"human>stock":281,"cbot>cbot":175,"human>human":10299,"human>other":3,"stock>stock":246}}};
const NS="http://www.w3.org/2000/svg";
const fmt=n=>n.toLocaleString("en-US");
const pc=(a,b)=>b?(100*a/b).toFixed(0)+"%":"n/a";
const tip=document.getElementById("tip");
function showTip(ev,html){tip.innerHTML=html;tip.style.opacity=1;const r=tip.getBoundingClientRect();let x=ev.clientX+14,y=ev.clientY+14;if(x+r.width>innerWidth-6)x=ev.clientX-r.width-14;if(y+r.height>innerHeight-6)y=ev.clientY-r.height-14;tip.style.left=x+"px";tip.style.top=y+"px"}
function hideTip(){tip.style.opacity=0}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function txt(parent,x,y,s,cls,anchor){const t=el("text",{x,y,class:cls||"ax","text-anchor":anchor||"start"},parent);t.textContent=s;return t}
function hover(node,html){node.addEventListener("mousemove",e=>showTip(e,html));node.addEventListener("mouseleave",hideTip)}
function svgIn(id,h){const host=document.getElementById(id);host.innerHTML="";const w=host.clientWidth;const s=el("svg",{width:w,height:h,viewBox:`0 0 ${w} ${h}`});host.appendChild(s);return [s,w]}
function hbar(p,x,y,w,h,fill,op){w=Math.max(w,1);const r=Math.min(4,w,h/2);return el("path",{d:`M${x},${y}h${w-r}a${r},${r} 0 0 1 ${r},${r}v${h-2*r}a${r},${r} 0 0 1 -${r},${r}h-${w-r}z`,fill,"fill-opacity":op==null?1:op},p)}
function vbar(p,x,y,w,h,fill){h=Math.max(h,0);const r=Math.min(3,w/2,h);return el("path",{d:`M${x},${y+h}v${-(h-r)}a${r},${r} 0 0 1 ${r},${-r}h${w-2*r}a${r},${r} 0 0 1 ${r},${r}v${h-r}z`,fill},p)}
const ms0=v=>v==null?"n/a":Math.round(v)+" ms";

const R=D.react,H=R.human,B=R.cbot;
const Hn=Math.max(H.n,1),Bn=Math.max(B.n,1);
(function(){
  const dm=(B.median!=null&&H.median!=null)?B.median-H.median:null;
  const rr=v=>v==null?"n/a":Math.abs(Math.round(v))+" ms "+(v>=0?"after":"before");
  document.getElementById("l1").innerHTML=
  `Time from an attacker's windup starting to the defender's parry starting. Humans parry at a median of <b>${ms0(H.median)}</b> (n = ${fmt(H.n)}), cbot at <b>${ms0(B.median)}</b> (n = ${fmt(B.n)})`+
  (dm==null?". ":`, so cbot is about ${Math.abs(Math.round(dm))} ms ${dm>=0?"slower":"faster"}. `)+
  `This is parry timing, not pure reaction speed: the median windup is ${ms0(H.windup_median)}, so the typical human parry begins about <b>${rr(H.rel_release_median)} the blow is released</b> (cbot ${rr(B.rel_release_median)}). `+
  `Parries under 100 ms: humans ${H.share_lt100==null?"n/a":(H.share_lt100*100).toFixed(1)+"%"}, cbot ${B.share_lt100==null?"n/a":(B.share_lt100*100).toFixed(1)+"%"}. `+
  `Full-rate rows only; attacker is a human within 350 cm; ${fmt(D.unmatched.human||0)} human and ${fmt(D.unmatched.cbot||0)} cbot parries had no attack to answer and are left out.`+
  (B.n<300?` cbot's sample is small (n = ${fmt(B.n)}), so its curve is rough.`:"");
})();

(function draw(){
  const bins=D.bins,nb=bins.length-1;const h=230,L=34,Rr=8,T=18,Bt=34;const [s,w]=svgIn("hist",h);
  const ph=H.hist.map(v=>v/Hn),pb=B.hist.map(v=>v/Bn);const mx=Math.max(...ph,...pb)*1.08||1;
  const X=ms=>L+ms/1000*(w-L-Rr),Y=v=>T+(1-v/mx)*(h-T-Bt);
  const g=el("g",{class:"grid"},s);
  const step=mx>0.2?0.1:0.05;
  for(let v=0;v<=mx;v+=step){el("line",{x1:L,x2:w-Rr,y1:Y(v),y2:Y(v)},g);txt(s,L-5,Y(v)+3.5,(v*100).toFixed(0)+"%","ax","end")}
  for(let ms=0;ms<=1000;ms+=200)txt(s,X(ms),h-18,ms+"","ax","middle");
  txt(s,L+(w-L-Rr)/2,h-4,"ms from attack start to parry start","ax","middle");
  const bw=(w-L-Rr)/nb;
  for(let i=0;i<nb;i++){
    const x=X(bins[i]);
    vbar(s,x+1,Y(ph[i]),bw/2-1.5,h-Bt-Y(ph[i]),"var(--human)");
    vbar(s,x+bw/2+.5,Y(pb[i]),bw/2-1.5,h-Bt-Y(pb[i]),"var(--bot)");
    hover(el("rect",{x,y:T,width:bw,height:h-T-Bt,class:"hit"},s),`<b>${bins[i]}-${bins[i+1]} ms</b><br>Humans ${(ph[i]*100).toFixed(1)}% (${fmt(H.hist[i])} of ${fmt(H.n)})<br>cbot ${(pb[i]*100).toFixed(1)}% (${fmt(B.hist[i])} of ${fmt(B.n)})`);
  }
  // medians
  [[H.median,"var(--human)","Humans "+ms0(H.median),"end"],[B.median,"var(--bot)","cbot "+ms0(B.median),"start"]].forEach(([m,c,l,a],i)=>{
    if(m==null)return;
    // when the two medians sit close together the labels would overlap: put the left one's label to its left, the other to its right
    const left=(H.median!=null&&B.median!=null)?(m<=Math.min(H.median,B.median)):true;
    const an=(H.median!=null&&B.median!=null)?(left?"end":"start"):a;
    el("line",{x1:X(m),x2:X(m),y1:T-4,y2:h-Bt,stroke:c,"stroke-width":1.6,"stroke-dasharray":"4 3"},s);
    txt(s,X(m)+(an==="end"?-4:4),T+4,l,"lbl",an).setAttribute("style","font-weight:600");
  });
})();

(function(){
  const mv=["RightStrike","LeftStrike","Stab","AltStab"];
  const hm=mv.map(m=>H.byMove[m].med).filter(v=>v!=null);
  const span=hm.length>1?Math.round(Math.max(...hm)-Math.min(...hm)):null;
  const thin=["RightStrike","LeftStrike","Stab","AltStab","Kick"].filter(m=>B.byMove[m].n<30).map(m=>`${m} (n = ${B.byMove[m].n})`);
  document.getElementById("l2").innerHTML=
  `Median time from attack start to parry start, split by the incoming attack's move. `+
  (span!=null?`Humans' medians across slashes, stab and alt stab span <b>${span} ms</b> (${Math.round(Math.min(...hm))} to ${Math.round(Math.max(...hm))} ms). `:"")+
  (thin.length?`cbot has under 30 parries against ${thin.join(", ")}, so read those as noise (faded bars have n under 30). `:"cbot has 30 or more parries against every move shown. ")+
  `Same filters as above.`;
})();
(function(){
  const cats=["RightStrike","LeftStrike","Stab","AltStab","Kick"];const rowH=40,T=4;const [s,w]=svgIn("moves",T+cats.length*rowH+20);const L=84,Rr=96;
  const mx=Math.max(...cats.flatMap(c=>[H.byMove[c].med||0,B.byMove[c].med||0]),1)*1.02;
  const X=v=>L+v/mx*(w-L-Rr);const g=el("g",{class:"grid"},s);
  for(let v=0;v<=mx;v+=200){el("line",{x1:X(v),x2:X(v),y1:0,y2:T+cats.length*rowH},g);txt(s,X(v),T+cats.length*rowH+13,v+" ms","ax","middle")}
  cats.forEach((c,i)=>{const y=T+i*rowH;txt(s,0,y+22,c,"lbl");
    [[H.byMove[c],"var(--human)","Humans"],[B.byMove[c],"var(--bot)","cbot"]].forEach(([d,fill,who],j)=>{
      const yy=y+4+j*16;
      if(d.med==null){txt(s,L+4,yy+11,"no parries","val");return}
      hbar(s,L,yy,X(d.med)-L,14,fill,d.n<30?.35:1);txt(s,X(d.med)+5,yy+11,Math.round(d.med)+" ms  n="+fmt(d.n),"val");
      hover(el("rect",{x:L,y:yy-1,width:w-L,height:16,class:"hit"},s),`<b>${who} · ${c}</b><br>median ${Math.round(d.med)} ms<br>n = ${fmt(d.n)} parries`)})});
})();

const O=D.outcome,Oh=O.human||{tot:0},Ob=O.cbot||{tot:0};
const og=(o,k)=>o[k]||0;
(function(){
  const moe=n=>n?(196*Math.sqrt(.25/n)).toFixed(0):null;
  document.getElementById("l3").innerHTML=
  `For every human slash or stab thrown at a defender within 350 cm (the nearest opponent), what the defender did. Humans parry <b>${pc(og(Oh,"parried"),Oh.tot)}</b> of incoming attacks and take a hit on <b>${pc(og(Oh,"hit"),Oh.tot)}</b> (n = ${fmt(Oh.tot)}); cbot parries <b>${pc(og(Ob,"parried"),Ob.tot)}</b> and takes a hit on <b>${pc(og(Ob,"hit"),Ob.tot)}</b> (n = ${fmt(Ob.tot)}). "Neither" covers everything else: a dodge, a chamber or block, a feint, a miss, an attacker flinched or killed first. A parry counts if the defender's parry begins within 1 s of the attack start, a hit if the hit event comes within 1.5 s; whichever came first wins. Full-rate rows only, stock bots left out. With n = ${fmt(Ob.tot)}, cbot's shares carry about ±${moe(Ob.tot)||"?"} points of sampling noise (humans ±${moe(Oh.tot)||"?"}).`;
})();
(function(){
  const cats=[["parried","Parried"],["hit","Hit the defender"],["neither","Neither"]];const rowH=44,T=4;const [s,w]=svgIn("out",T+cats.length*rowH);const L=104,Rr=60;
  const sh=(o,k)=>o.tot?og(o,k)/o.tot:0;
  const mx=Math.max(...cats.flatMap(([k])=>[sh(Oh,k),sh(Ob,k)]),1e-9)*1.02;
  cats.forEach(([k,lab],i)=>{const y=T+i*rowH;txt(s,0,y+24,lab,"lbl");
    [[Oh,"var(--human)","Humans"],[Ob,"var(--bot)","cbot"]].forEach(([d,fill,who],j)=>{
      const v=sh(d,k),yy=y+4+j*17;const bw=v/mx*(w-L-Rr);hbar(s,L,yy,bw,15,fill);txt(s,L+bw+5,yy+12,(v*100).toFixed(1)+"%","val");
      hover(el("rect",{x:L,y:yy-1,width:w-L,height:17,class:"hit"},s),`<b>${who} defending · ${lab}</b><br>${fmt(og(d,k))} of ${fmt(d.tot)} incoming attacks (${(v*100).toFixed(1)}%)`)})});
})();
